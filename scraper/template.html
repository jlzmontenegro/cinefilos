<script>
"use strict";
/* ==========================================================================
   Catálogo Cinefilos — lógica de la interfaz
   Los datos vienen incrustados en el <script id="data">, así que el archivo
   funciona sin servidor ni conexión (salvo pósters y reproductor, que son
   remotos).
   ========================================================================== */
const C = crearClasificador();

/* Los datos van guardados por columnas y sin lo que se puede recalcular, para
   que el archivo pese bastante menos. Aquí se reconstruyen los objetos tal y
   como los produce normalize.mjs, así que el resto del código no se entera. */
const DB = (() => {
  const raw = JSON.parse(document.getElementById('data').textContent);
  const { campos, dic, px, filas } = raw;
  const movies = filas.map((f) => {
    const m = {};
    campos.forEach((c, i) => {
      let v = f[i];
      if (v !== null) {
        if (c === 'paises' || c === 'generos') v = v.map((x) => dic[c][x]);
        else if (c === 'tipo' || c === 'idioma') v = dic[c][v];
        else if (c === 'poster' && !/^https?:/.test(v)) v = px + v;
      }
      m[c] = v;
    });
    // campos derivados: no se guardan porque se obtienen de los anteriores
    m.titulo = m.tituloAlt || m.tituloOriginal;
    m.url = `https://ok.ru/cinefiliamalversa/topic/${m.id}`;
    m.decada = m.anio ? Math.floor(m.anio / 10) * 10 : null;
    m.paises = m.paises || [];
    m.generos = m.generos || [];
    m.directores = m.directores || [];
    m.banderas = m.paises.map((p) => C.FLAG[p] || '🏳️');
    m.thumb = null;
    m.comentarios = 0;
    return m;
  });
  return { meta: raw.meta, movies };
})();
const META = DB.meta;

/* Los títulos que no estaban la última vez que se abrió el catálogo. Se calcula
   en el navegador comparando con lo ya visto, así que cada visitante ve los suyos. */
/* Sólo se puede ver algo si hay reproducción directa (videoId) o al menos una
   fuente alternativa (embed). Lo demás es una ficha sin película detrás, así que
   se queda fuera del catálogo: fuera de las cifras, de los filtros y del buscador. */
const reproducible = m => !!(m && (m.videoId || m.embed));
const M = (() => {
  return DB.movies.filter(reproducible)
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
})();

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hhmm = s => { if (!s) return null; const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, '0')} min` : `${m} min`; };
const fecha = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' }); };

// Restos de la sincronización que hacía el propio navegador, ya retirada: el
// catálogo se actualiza solo en el servidor. Se borra para no dejar basura.
try { localStorage.removeItem('cm.delta'); localStorage.removeItem('cm.ultimaSync'); } catch {}

const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('cm.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cm.' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- índice de búsqueda ---------- */
M.forEach((m, i) => {
  m._i = i;
  // Tres niveles: los títulos sueltos, títulos + dirección, y la ficha entera.
  // El buscador los usa para no dar el mismo peso a un título que a una sinopsis.
  m._tits = [m.titulo, m.tituloOriginal, m.tituloAlt].filter(Boolean).map(fold);
  m._tit = m._tits.join(' · ');
  m._t = m._tit + ' ' + fold((m.directores || []).join(' '));
  m._s = m._t + ' ' + fold([(m.paises || []).join(' '), (m.generos || []).join(' '),
    m.anio, m.tipo, m.sinopsis].join(' '));
});

/* Palabras que no distinguen nada: si se buscan dentro de la sinopsis, cualquier
   frase normal devuelve medio catálogo. Sólo cuentan si están en el título o en
   la dirección, igual que las palabras de tres letras o menos. */
const VACIAS = new Set(('de del la el los las un una unos unas y e o u que no ni con por para al ' +
  'en es son su sus se lo le les como mas más pero sin sobre entre cuando donde todo toda todos ' +
  'todas esta este esto esa ese eso aquel muy ya tras desde hasta a').split(' '));
const debil = t => t.length <= 3 || VACIAS.has(t);

/* ---------- novedades: qué había la última vez ---------- */
const NOVEDADES = (() => {
  const prev = LS.get('seen', null);
  let ids;
  if (!prev) {                       // primera visita: novedades = últimos 10 días
    const corte = Date.now() - 10 * 864e5;
    ids = M.filter(m => m.fecha && new Date(m.fecha).getTime() > corte).map(m => m.id);
  } else {
    const set = new Set(prev);
    ids = M.filter(m => !set.has(m.id)).map(m => m.id);
  }
  return new Set(ids);
})();
const marcarVistas = () => { LS.set('seen', M.map(m => m.id)); };

/* ---------- estado ---------- */
const FAVS = new Set(LS.get('favs', []));

/* ---------- seguir viendo ----------
   Lo que cada visitante ha empezado a reproducir, lo más reciente primero. Vive
   sólo en su navegador, como los favoritos y las novedades.
   Ojo con lo que esto NO es: el reproductor de ok.ru va en un iframe de otro
   dominio y no deja preguntarle por dónde va, así que no hay minuto guardado ni
   barra de progreso. Es «lo que abriste», no «lo que llevas visto». */
const VIENDO = LS.get('viendo', []).filter(id => M.some(m => m.id === id));
const TOPE_VIENDO = 20;
function apuntarVisto(id) {
  if (!id) return;
  const i = VIENDO.indexOf(id);
  if (i >= 0) VIENDO.splice(i, 1);
  VIENDO.unshift(id);
  VIENDO.length = Math.min(VIENDO.length, TOPE_VIENDO);
  LS.set('viendo', VIENDO);
  refrescarPortada();
}
function olvidarVistos() {
  VIENDO.length = 0;
  LS.set('viendo', VIENDO);
  refrescarPortada();
}
/* Se rehacen las filas, no `App.aplicar()` entero: si el usuario estaba en una
   rejilla filtrada, aplicar() la repinta desde arriba y pierde el sitio donde
   iba. La portada, en cambio, siempre se puede rehacer sin que se note. */
function refrescarPortada() {
  if ($('#rows-view').hidden) return;
  selloViendo = VIENDO.join(',');
  construirFilas(baseActual());
}
const S = {
  q: '', generos: new Set(), paises: new Set(), decadas: new Set(), tipos: new Set(),
  idiomas: new Set(), directores: new Set(), imdbMin: 0, soloNuevas: false, soloFavs: false,
  soloDirecta: false, soloSeries: false, orden: 'recientes', anioMin: null, anioMax: null
};

/* Serie, miniserie o serie documental: todo lo que se ve por capítulos. El panel
   de filtros permite afinar por tipo exacto; esto es el atajo de la barra.
   Las dos mitades del catálogo van completamente separadas: en Películas no
   asoma ninguna serie, y al revés. Cada una tiene su portada y sus filas. */
const esSerie = m => /serie/i.test(m.tipo || '');
const SERIES = M.filter(esSerie);
const PELIS = M.filter(m => !esSerie(m));
const baseActual = () => (S.soloSeries ? SERIES : PELIS);

/* ---------- facetas ---------- */
function contar(campo) {
  const c = new Map();
  for (const m of M) {
    const v = m[campo];
    if (Array.isArray(v)) v.forEach(x => c.set(x, (c.get(x) || 0) + 1));
    else if (v != null && v !== '') c.set(v, (c.get(v) || 0) + 1);
  }
  return [...c.entries()].sort((a, b) => b[1] - a[1]);
}
const F = {
  generos: contar('generos'), paises: contar('paises'), tipos: contar('tipo'),
  idiomas: contar('idioma'), decadas: contar('decada').sort((a, b) => b[0] - a[0]),
  directores: (() => {
    const c = new Map();
    M.forEach(m => (m.directores || []).forEach(d => c.set(d, (c.get(d) || 0) + 1)));
    return [...c.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  })()
};
const ANIOS = M.map(m => m.anio).filter(Boolean);
const ANIO_MIN = Math.min(...ANIOS), ANIO_MAX = Math.max(...ANIOS);

/* ---------- filtrado ---------- */
/* Qué tan bien encaja una película con lo buscado: cuanto más bajo, más arriba. */
function relevancia(m, q, terms) {
  if (m._tits.includes(q)) return 0;                     // el título es justo eso
  if (m._tits.some(t => t.startsWith(q))) return 1;      // el título empieza así
  if (terms.every(t => m._tit.includes(t))) return 2;    // está en el título
  if (terms.every(t => m._t.includes(t))) return 3;      // está en la dirección
  return 4;                                              // sólo en el resto de la ficha
}

function filtrar() {
  const q = fold(S.q).trim();
  const terms = q ? q.split(/\s+/).filter(Boolean) : [];
  const coincide = (m, t) => debil(t) ? m._t.includes(t) : m._s.includes(t);
  /* Navegar va separado, pero buscar no: quien escribe un título quiere
     encontrarlo, y tener que acordarse de en qué mitad está es absurdo. Por eso al
     buscar se mira el catálogo entero, y las tarjetas avisan de cuál es serie. */
  let out = (terms.length ? M : baseActual()).filter(m => {
    if (terms.length && !terms.every(t => coincide(m, t))) return false;
    if (S.generos.size && !(m.generos || []).some(g => S.generos.has(g))) return false;
    if (S.paises.size && !(m.paises || []).some(p => S.paises.has(p))) return false;
    if (S.decadas.size && !S.decadas.has(m.decada)) return false;
    if (S.tipos.size && !S.tipos.has(m.tipo)) return false;
    if (S.idiomas.size && !S.idiomas.has(m.idioma)) return false;
    if (S.directores.size && !(m.directores || []).some(d => S.directores.has(d))) return false;
    if (S.imdbMin && !(m.imdb >= S.imdbMin)) return false;
    if (S.anioMin && !(m.anio >= S.anioMin)) return false;
    if (S.anioMax && !(m.anio <= S.anioMax)) return false;
    if (S.soloNuevas && !NOVEDADES.has(m.id)) return false;
    if (S.soloFavs && !FAVS.has(m.id)) return false;
    if (S.soloDirecta && !m.videoId) return false;
    return true;
  });
  const ord = {
    recientes: (a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')),
    'anio-desc': (a, b) => (b.anio || 0) - (a.anio || 0),
    'anio-asc': (a, b) => (a.anio || 9999) - (b.anio || 9999),
    imdb: (a, b) => (b.imdb || 0) - (a.imdb || 0),
    titulo: (a, b) => fold(a.titulo).localeCompare(fold(b.titulo)),
    duracion: (a, b) => (b.duracion || 0) - (a.duracion || 0)
  }[S.orden];
  // Al buscar manda la relevancia, salvo que se haya pedido un orden concreto:
  // en ese caso se respeta al pie de la letra.
  if (!terms.length) return out.sort(ord);
  if (S.orden === 'recientes') {
    const peso = new Map(out.map(m => [m, relevancia(m, q, terms)]));
    out.sort((a, b) => peso.get(a) - peso.get(b) || ord(a, b));
  } else {
    out.sort(ord);
  }
  /* Se agrupan por tipo, y delante va el de la sección desde la que buscas: si
     estás en Series y buscas, lo primero que quieres ver son series. El orden de
     dentro no se toca: `sort` es estable, así que la relevancia aguanta. */
  const primero = m => (esSerie(m) === !!S.soloSeries ? 0 : 1);
  return out.sort((a, b) => primero(a) - primero(b));
}
/* «Series» no cuenta como filtro: es una sección con su propia portada, igual que
   Películas. Lo que decide entre portada y rejilla es el resto. */
const hayFiltros = () => S.q.trim() || S.generos.size || S.paises.size || S.decadas.size || S.tipos.size ||
  S.idiomas.size || S.directores.size || S.imdbMin || S.soloNuevas || S.soloFavs || S.soloDirecta ||
  S.anioMin || S.anioMax;

/* Los enlaces de imagen de ok.ru van firmados y caducan con el tiempo: cuando
   uno devuelve 410 se marca el contenedor para que dibuje su propio fondo. */
function posterCaido(el) {
  const caja = el.closest('.shell') || el.closest('.poster');
  if (caja) {
    caja.classList.add('sin-poster');
    caja.querySelector('.fill')?.remove();
  }
  el.remove();
}
window.posterCaido = posterCaido;

/* ---------- qué trae la serie ----------
   `tramo` es [temporada, desde, hasta, total], leído del nombre del vídeo de ok.ru
   («2019 Undone s1 e1-8») y del recuento que declara la sinopsis. Todo lo que no
   se sepa va a null, y sólo se afirma «completa» cuando el vídeo llega al último
   episodio declarado. Cuando no hay total no se dice nada: 180 de las 188 que se
   pueden juzgar están incompletas, así que callarse es la única opción honesta
   para las demás. */
function tramoTexto(m) {
  if (!m.tramo) return null;
  const [temp, desde, hasta, total] = m.tramo;
  const partes = [];
  if (temp != null) partes.push('T' + temp);
  if (desde != null) partes.push(desde === hasta ? 'E' + desde : `E${desde}-${hasta}`);
  if (!partes.length) return total != null ? { txt: `${total} episodios`, estado: null } : null;
  let txt = partes.join(' · ');
  if (total != null) txt += ` de ${total}`;
  const estado = (hasta == null || total == null) ? null : (hasta >= total ? 'completa' : 'parcial');
  return { txt, estado };
}

/* ---------- tarjeta ---------- */
function card(m) {
  const nuevo = NOVEDADES.has(m.id);
  const fav = FAVS.has(m.id);
  const img = m.poster || m.thumb || '';
  const sub = [m.anio, (m.directores || [])[0]].filter(Boolean).join(' · ');
  return `<article class="card" data-id="${m.id}" tabindex="0" aria-label="${esc(m.titulo)}">
    <div class="shell">
      ${img ? `<div class="fill" style="background-image:url('${esc(img)}')"></div>
      <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="posterCaido(this)">` : ''}
      <div class="spec"></div>
      <div class="tags">
        ${nuevo ? '<span class="chip new">NUEVO</span>' : ''}
        ${esSerie(m) ? (t => `<span class="chip serie${t ? ' eps' : ''}${t?.estado === 'parcial' ? ' parcial' : ''}">${
          esc(t ? t.txt : (m.tipo === 'Serie' ? 'Serie' : m.tipo))}</span>`)(tramoTexto(m)) : ''}
        ${m.imdb ? `<span class="chip star">★ ${m.imdb.toFixed(1)}</span>` : ''}
      </div>
      <button class="fav ${fav ? 'on' : ''}" data-fav="${m.id}" title="Mi lista">${fav ? '♥' : '♡'}</button>
      <div class="foot">
        <b>${esc(m.titulo)}</b>
        <span>${esc(sub)}</span>
      </div>
    </div>
  </article>`;
}

/* ---------- filas ----------
   Las carátulas de cada fila NO se construyen al armar la portada: se guardan
   aparte y se pintan cuando la fila se acerca a la pantalla. La portada tenía 31
   filas × 32 carátulas = 980 tarjetas y 13.721 nodos de golpe, y sólo se veían
   las dos primeras. Las imágenes ya iban con `loading=lazy`, pero lo que costaba
   no era bajarlas: era construir el DOM. */
let filaN = 0;
const filaPendiente = new Map();          // id de la fila → películas que le tocan

const railObs = new IntersectionObserver((entradas) => {
  for (const e of entradas) {
    if (!e.isIntersecting) continue;
    llenarFila(e.target);
    railObs.unobserve(e.target);
  }
  // Un margen generoso: la fila se pinta antes de asomar, así nunca se ve el hueco
}, { rootMargin: '700px 0px' });

function llenarFila(el) {
  const lista = filaPendiente.get(el.id);
  if (!lista) return;
  filaPendiente.delete(el.id);
  el.innerHTML = lista.map(card).join('');
}

function fila(titulo, lista, extra = '', accion = '') {
  if (!lista.length) return '';
  const id = 'r' + (++filaN).toString(36);
  filaPendiente.set(id, lista.slice(0, 32));
  return `<section class="row">
    <div class="row-head">
      <h2>${esc(titulo)}</h2><span class="count">${lista.length}</span>
      ${extra ? `<span class="more" data-more='${extra}'>Ver todas →</span>` : ''}${accion}
    </div>
    <div class="rail-wrap">
      <button class="rail-btn l" data-rail="${id}" data-dir="-1">‹</button>
      <div class="rail" id="${id}"></div>
      <button class="rail-btn r" data-rail="${id}" data-dir="1">›</button>
    </div>
  </section>`;
}

/* Pone en marcha el observador y pinta ya las dos primeras, que están a la vista
   desde el primer momento: esperar al observador dejaría un parpadeo. */
function activarFilas() {
  const rails = $$('#rows-view .rail');
  rails.forEach((el, i) => (i < 2 ? llenarFila(el) : railObs.observe(el)));
}

/* Cuenta valores sobre la lista que se le pase, para poder armar las filas de un
   subconjunto (las series) igual que las del catálogo entero. */
function facetas(base, campo) {
  const c = new Map();
  for (const m of base) {
    const v = m[campo];
    if (Array.isArray(v)) v.forEach(x => c.set(x, (c.get(x) || 0) + 1));
    else if (v != null && v !== '') c.set(v, (c.get(v) || 0) + 1);
  }
  return [...c.entries()].sort((a, b) => b[1] - a[1]);
}

/* La portada. Se arma sobre `base` para que Series tenga la suya propia: mismas
   secciones, mismo aspecto, pero contando sólo lo que hay dentro. Los umbrales
   bajan cuando la base es pequeña; con los del catálogo entero (8 por género,
   25 por década) las series se quedaban casi sin filas. */
function construirFilas(base = M) {
  /* Antes de armar nada se tira lo que quedara pendiente de la portada anterior:
     al cambiar de sección esas filas ya no existen y sus listas se quedarían
     ocupando memoria sin que nadie las vaya a pintar nunca. */
  filaPendiente.clear();
  const seccion = base === M ? 'catalogo' : 'series';
  const chico = base.length < 1000;
  const minGenero = chico ? 4 : 8, minPais = chico ? 4 : 10, minDecada = chico ? 6 : 25;
  const Fb = seccion === 'catalogo'
    ? F
    : { generos: facetas(base, 'generos'), paises: facetas(base, 'paises'), decadas: facetas(base, 'decada').sort((a, b) => b[0] - a[0]) };

  const nuevas = base.filter(m => NOVEDADES.has(m.id));
  /* «Añadidas recientemente» salta lo que ya está en Novedades. Si no, las dos
     filas enseñan casi las mismas películas una debajo de otra: lo más reciente
     es, justamente, lo que aún no habías visto. */
  const recientes = base.filter(m => !NOVEDADES.has(m.id)).slice(0, 32);
  const top = [...base].filter(m => m.imdb >= 7.5).sort((a, b) => b.imdb - a.imdb).slice(0, 32);
  const clasicos = [...base].filter(m => m.anio && m.anio < 1970).sort((a, b) => b.imdb - a.imdb).slice(0, 32);
  const html = [];

  /* Lo primero bajo el héroe, porque es lo único de la portada que es suyo: lo
     que dejó a medias. Se respeta la separación de secciones —dentro de Series
     sólo salen series—, igual que el resto de filas. */
  const viendo = VIENDO.map(id => base.find(m => m.id === id)).filter(Boolean);
  if (viendo.length) {
    html.push(fila('▸ Seguir viendo', viendo, '', '<span class="more" data-olvidar="1">Vaciar</span>'));
  }
  if (nuevas.length) html.push(fila(`✦ Novedades desde tu última visita`, nuevas, JSON.stringify({ soloNuevas: true })));
  if (seccion === 'catalogo' && FAVS.size) {
    html.push(fila('♥ Mi lista', base.filter(m => FAVS.has(m.id)), JSON.stringify({ soloFavs: true })));
  }
  html.push(fila('Añadidas recientemente', recientes));
  if (seccion !== 'catalogo') {
    // Dentro de Series, una fila por cada formato. Los plurales van a mano: con
    // añadir una «s» salía «Serie documentals».
    const plural = { 'Serie': 'Series', 'Miniserie': 'Miniseries', 'Serie documental': 'Series documentales' };
    for (const t of ['Serie', 'Miniserie', 'Serie documental']) {
      const lista = base.filter(m => m.tipo === t);
      if (lista.length >= 6) html.push(fila(plural[t], lista, JSON.stringify({ tipos: [t] })));
    }
  }
  html.push(fila('Mejor valoradas en IMDb', top, JSON.stringify({ imdbMin: 7.5 })));

  // Un carrusel por cada género importante
  for (const [g, n] of Fb.generos.slice(0, 10)) {
    if (n < minGenero) continue;
    html.push(fila(g, base.filter(m => (m.generos || []).includes(g)), JSON.stringify({ generos: [g] })));
  }
  if (clasicos.length >= 6) html.push(fila('Clásicos anteriores a 1970', clasicos, JSON.stringify({ anioMax: 1969 })));
  // Un carrusel por país destacado
  for (const [p, n] of Fb.paises.slice(1, 7)) {
    if (n < minPais) continue;
    html.push(fila(`Cine de ${p}`, base.filter(m => (m.paises || []).includes(p)), JSON.stringify({ paises: [p] })));
  }
  // Décadas
  for (const [d, n] of Fb.decadas) {
    if (n < minDecada || !d) continue;
    html.push(fila(`Los ${d}`, base.filter(m => m.decada === d), JSON.stringify({ decadas: [d] })));
  }
  $('#rows-view').innerHTML = html.join('');
  activarFilas();
}

/* ---------- la cita del pie ----------
   Dos clases de cita: réplicas de película, atribuidas al título y su año, y frases
   de cineastas sobre el oficio, atribuidas a la persona. `peli:true` distingue las
   primeras para poder ponerlas en cursiva.
   Se sortea una en cada carga —como el héroe, así cada visitante ve la suya— y al
   pinchar sale otra. Sin temporizador: una frase que cambia sola mientras la lees
   es justo lo que se quitó de la franja de cifras. */
const CITAS = [
  ['Siempre nos quedará París.', 'Casablanca (1942)', true],
  ['Le haré una oferta que no podrá rechazar.', 'El padrino (1972)', true],
  ['Nadie es perfecto.', 'Con faldas y a lo loco (1959)', true],
  ['He visto cosas que vosotros no creeríais.', 'Blade Runner (1982)', true],
  ['Abróchense los cinturones, va a ser una noche movidita.', 'Eva al desnudo (1950)', true],
  ['Podría haber sido un contendiente. Podría haber sido alguien.', 'La ley del silencio (1954)', true],
  ['Que la Fuerza te acompañe.', 'La guerra de las galaxias (1977)', true],
  ['Está bien, señor DeMille, ya estoy lista para mi primer plano.', 'El crepúsculo de los dioses (1950)', true],
  ['La vida es como una caja de bombones: nunca sabes lo que te va a tocar.', 'Forrest Gump (1994)', true],
  ['Al infinito y más allá.', 'Toy Story (1995)', true],
  ['El cine es la verdad veinticuatro veces por segundo.', 'Jean-Luc Godard', false],
  ['El drama es la vida a la que se le han quitado las partes aburridas.', 'Alfred Hitchcock', false],
  ['Si se puede escribir o pensar, se puede filmar.', 'Stanley Kubrick', false],
  ['El cine es esculpir en el tiempo.', 'Andréi Tarkovski', false],
  ['El cine parece haber sido inventado para expresar la vida del subconsciente.', 'Luis Buñuel', false],
  ['Un escritor necesita una pluma; un pintor, un pincel; un cineasta, un ejército.', 'Orson Welles', false],
  ['El cine es una cuestión de qué hay dentro del encuadre y qué se queda fuera.', 'Martin Scorsese', false],
  ['Las películas son más armoniosas que la vida.', 'François Truffaut', false],
  ['Si tienes un problema en el tercer acto, el problema de verdad está en el primero.', 'Billy Wilder', false],
];
let citaI = -1;
function pintarCita() {
  // Nunca repite la que ya estaba: pinchar y que no cambie nada parece que falla
  let i = citaI;
  while (CITAS.length > 1 && i === citaI) i = Math.floor(Math.random() * CITAS.length);
  citaI = i;
  const [texto, autor, peli] = CITAS[i];
  $('#cita').innerHTML = `<p${peli ? ' class="repl"' : ''}>${esc(texto)}</p>
    <cite>${esc(autor)}</cite>`;
}

/* Las cifras del catálogo. Antes iban en una franja amarilla que se deslizaba sin
   parar bajo la barra: mucho ruido y mucho sitio para un dato que se mira una vez.
   Ahora esperan quietas al final, para quien tenga la curiosidad. */
function construirTicker() {
  const dirs = new Set(); M.forEach(m => (m.directores || []).forEach(d => dirs.add(d)));
  const horas = Math.round(M.reduce((s, m) => s + (m.duracion || 0), 0) / 3600);
  const decTop = F.decadas.slice().sort((a, b) => b[1] - a[1])[0];
  const stats = [
    [M.length.toLocaleString('es'), 'títulos'],
    [dirs.size.toLocaleString('es'), 'directores'],
    [F.paises.length, 'países'],
    [F.generos.length, 'géneros'],
    [`${ANIO_MIN}–${ANIO_MAX}`, 'años de cine'],
    [horas.toLocaleString('es'), 'horas de metraje'],
    [decTop ? decTop[0] + 's' : '—', 'la década más nutrida'],
  ];
  $('#cifras').innerHTML = stats.map(([v, k]) =>
    `<span><b>${esc(v)}</b>${esc(k)}</span>`).join('');
}

/* ---------- rejilla con carga progresiva ---------- */
let gridData = [], gridShown = 0, gridGrupos = null, gridUltimoGrupo = null;
function pintarGrid(reset) {
  if (reset) {
    gridData = filtrar(); gridShown = 0; $('#grid').innerHTML = '';
    gridUltimoGrupo = null;
    // Si la búsqueda ha traído de los dos tipos, se presentan por separado, como
    // las secciones. Con uno solo no hace falta encabezado.
    const nSeries = gridData.filter(esSerie).length;
    gridGrupos = (S.q.trim() && nSeries && nSeries < gridData.length)
      ? { pelis: gridData.length - nSeries, series: nSeries } : null;
  }
  const lote = gridData.slice(gridShown, gridShown + 60);
  // Los encabezados se intercalan al vuelo, así funcionan con la carga por tandas
  let trozos = '';
  for (const m of lote) {
    const grupo = esSerie(m) ? 'series' : 'pelis';
    if (gridGrupos && grupo !== gridUltimoGrupo) {
      gridUltimoGrupo = grupo;
      trozos += `<h3 class="grupo">${grupo === 'pelis' ? 'Películas' : 'Series'}
        <span>${gridGrupos[grupo].toLocaleString('es')}</span></h3>`;
    }
    trozos += card(m);
  }
  $('#grid').insertAdjacentHTML('beforeend', trozos);
  gridShown += lote.length;
  $('#sentinel').textContent = gridShown >= gridData.length
    ? (gridData.length ? '· fin del catálogo ·' : '') : 'Cargando…';
  if (reset) {
    const n = gridData.length;
    const q = S.q.trim();
    $('#res-title').innerHTML = q ? `<span class="term">“${esc(q)}”</span>`
      : (S.soloNuevas ? 'Novedades' : S.soloFavs ? 'Mi lista'
        : S.soloSeries ? 'Series y miniseries' : 'Explorar catálogo');
    // buscando, el orden por defecto es la relevancia; sin buscar, la fecha
    $('#sort').options[0].textContent = q ? 'Más relevantes' : 'Añadidas primero';
    // Marcador visible: dice sin rodeos si la búsqueda encontró algo
    const pill = $('#res-pill');
    pill.textContent = n ? `${n.toLocaleString('es')} resultado${n === 1 ? '' : 's'}` : 'Sin resultados';
    pill.classList.toggle('vacio', !n);
    // Al buscar se mira el catálogo entero, así que conviene decir cuántas de las
    // que salen son series: si no, sorprende ver una en la sección de películas.
    const series = q ? gridData.filter(esSerie).length : 0;
    $('#res-sub').textContent = n
      ? (q ? `de ${M.length.toLocaleString('es')} títulos del catálogo` +
             (series ? ` · ${series} ${series === 1 ? 'es serie' : 'son series'}` : '')
           : `${n.toLocaleString('es')} título${n === 1 ? '' : 's'} con lo que has elegido`)
      : (q ? 'Revisa la ortografía o usa menos palabras'
           : 'Ningún título coincide con los filtros activos');
    if (!n) {
      $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="big">🔍</div>
        <b>${q ? `No encontramos nada para <span class="term">“${esc(q)}”</span>`
               : 'Ningún título coincide con los filtros'}</b>
        <p>${q ? 'Prueba con menos palabras o revisa la ortografía. También puedes buscar por director, país, género o año.'
               : 'Prueba a quitar alguno de los filtros activos.'}</p>
        <button class="btn-primary" onclick="App.${q ? 'limpiarBusqueda' : 'clearFilters'}()">
          ${q ? '✕ Limpiar búsqueda' : '✕ Quitar filtros'}
        </button></div>`;
    }
  }
  pintarChipsActivos();
}
new IntersectionObserver(es => {
  if (es[0].isIntersecting && gridShown < gridData.length) pintarGrid(false);
}, { rootMargin: '600px' }).observe($('#sentinel'));

/* ---------- chips de filtros activos ---------- */
function pintarChipsActivos() {
  const chips = [];
  const add = (k, label, fn) => chips.push(`<span class="af"><b>${esc(k)}</b> ${esc(label)}<button data-clear='${fn}'>✕</button></span>`);
  S.generos.forEach(g => add('Género', g, JSON.stringify(['generos', g])));
  S.paises.forEach(p => add('País', p, JSON.stringify(['paises', p])));
  S.decadas.forEach(d => add('Década', d + 's', JSON.stringify(['decadas', d])));
  S.tipos.forEach(t => add('Tipo', t, JSON.stringify(['tipos', t])));
  S.idiomas.forEach(i => add('Idioma', i, JSON.stringify(['idiomas', i])));
  S.directores.forEach(d => add('Director', d, JSON.stringify(['directores', d])));
  if (S.imdbMin) add('IMDb', '≥ ' + S.imdbMin, JSON.stringify(['imdbMin']));
  if (S.anioMin) add('Desde', S.anioMin, JSON.stringify(['anioMin']));
  if (S.anioMax) add('Hasta', S.anioMax, JSON.stringify(['anioMax']));
  if (S.soloDirecta) add('Sólo', 'reproducción directa', JSON.stringify(['soloDirecta']));
  // Buscando se mira el catálogo entero, así que la sección no está recortando
  // nada: enseñar «Sólo series» junto a resultados de películas confundiría.
  if (S.soloSeries && !S.q.trim()) add('Sólo', 'series', JSON.stringify(['soloSeries']));
  $('#active-filters').innerHTML = chips.join('');
  const n = chips.length;
  $('#f-count').style.display = n ? '' : 'none';
  $('#f-count').textContent = n;
  $('#f-results').textContent = filtrar().length.toLocaleString('es');
}

/* ---------- panel de filtros ---------- */
function grupoOpts(key, entries, { buscador = false, scroll = buscador, fmt = x => x } = {}) {
  const sel = S[key];
  const opts = entries.map(([v, n]) =>
    `<span class="opt ${sel.has(v) ? 'on' : ''}" data-set="${key}" data-val="${esc(v)}">${esc(fmt(v))} <i class="c">${n}</i></span>`).join('');
  return `${buscador ? `<input class="fsearch" placeholder="Filtrar…" data-fsearch="${key}">` : ''}
    <div class="${scroll ? 'scrolly' : ''}"><div class="opts" data-opts="${key}">${opts}</div></div>`;
}
/* Cada grupo es un desplegable. Antes iban todos abiertos y el panel medía tres
   pantallas y media: sólo los 38 géneros llenaban lo visible, así que para llegar
   a «Década» había que pasar por 38 géneros y 75 países. Plegados, todo cabe de un
   vistazo y la cabecera dice qué llevas elegido en cada uno. */
function grupo(clave, titulo, contenido, { abierto = false } = {}) {
  /* El panel se reconstruye entero al quitar un chip o al entrar por un enlace de
     género, y cerrarle al usuario lo que tenía abierto es desconcertante. El DOM
     viejo sigue en pie mientras se arma la plantilla, así que se le pregunta.
     Un grupo con filtros puestos se abre solo: si no, el chip activo quedaría
     escondido detrás de una cabecera plegada. */
  const previo = document.querySelector(`#filters-body .fgroup[data-grupo="${clave}"]`);
  const abre = (previo ? previo.open : abierto) || !!resumenGrupo(clave);
  return `<details class="fgroup" data-grupo="${clave}"${abre ? ' open' : ''}>
    <summary><span class="tit">${esc(titulo)}</span><span class="elegido" data-resumen="${clave}"></span></summary>
    <div class="dentro">${contenido}</div>
  </details>`;
}

function construirFiltros() {
  $('#filters-body').innerHTML = `
    ${/* Los 38 géneros abiertos llenaban por sí solos toda la pantalla y volvían a
          esconder el resto de grupos; con tope propio se ve el mapa completo. */''}
    ${grupo('generos', 'Género', grupoOpts('generos', F.generos, { scroll: true }), { abierto: true })}
    ${grupo('decadas', 'Década', grupoOpts('decadas', F.decadas, { fmt: d => d + 's' }))}
    ${grupo('paises', 'País', grupoOpts('paises', F.paises, { buscador: true }))}
    ${grupo('anios', 'Años', `
      <div class="rng"><span>Desde</span>
        <input type="range" id="anio-min" min="${ANIO_MIN}" max="${ANIO_MAX}" value="${S.anioMin || ANIO_MIN}">
        <output id="anio-min-o">${S.anioMin || ANIO_MIN}</output></div>
      <div class="rng"><span>Hasta</span>
        <input type="range" id="anio-max" min="${ANIO_MIN}" max="${ANIO_MAX}" value="${S.anioMax || ANIO_MAX}">
        <output id="anio-max-o">${S.anioMax || ANIO_MAX}</output></div>`)}
    ${grupo('imdbMin', 'Valoración mínima', `
      <div class="rng"><span>IMDb</span>
        <input type="range" id="imdb" min="0" max="9" step="0.5" value="${S.imdbMin || 0}">
        <output id="imdb-o">${S.imdbMin ? '★ ' + S.imdbMin : 'Todas'}</output></div>`)}
    ${grupo('directores', 'Director', grupoOpts('directores', F.directores, { buscador: true }))}
    ${grupo('tipos', 'Tipo de obra', grupoOpts('tipos', F.tipos))}
    ${grupo('idiomas', 'Idioma y subtítulos', grupoOpts('idiomas', F.idiomas))}
    ${grupo('otros', 'Otros', `
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="t-new"${S.soloNuevas ? ' checked' : ''}> Sólo novedades</label>
        <label class="tg"><input type="checkbox" id="t-fav"${S.soloFavs ? ' checked' : ''}> Sólo mi lista</label>
        <label class="tg"><input type="checkbox" id="t-dir"${S.soloDirecta ? ' checked' : ''}> Sólo con reproducción directa</label>
      </div>`)}`;

  const rango = (idIn, idOut, campo, fmt = v => v) => {
    const el = $('#' + idIn), out = $('#' + idOut);
    el.addEventListener('input', () => { out.textContent = fmt(+el.value); });
    el.addEventListener('change', () => {
      S[campo] = campo === 'imdbMin' ? (+el.value || 0)
        : (campo === 'anioMin' ? (+el.value > ANIO_MIN ? +el.value : null) : (+el.value < ANIO_MAX ? +el.value : null));
      App.aplicar();
    });
  };
  rango('anio-min', 'anio-min-o', 'anioMin');
  rango('anio-max', 'anio-max-o', 'anioMax');
  rango('imdb', 'imdb-o', 'imdbMin', v => v ? '★ ' + v : 'Todas');
  $('#t-new').onchange = e => { S.soloNuevas = e.target.checked; App.aplicar(); };
  $('#t-fav').onchange = e => { S.soloFavs = e.target.checked; App.aplicar(); };
  $('#t-dir').onchange = e => { S.soloDirecta = e.target.checked; App.aplicar(); };
  actualizarContadoresGrupo();
}
/* La cabecera de cada grupo plegado dice qué llevas elegido dentro. Sin esto,
   plegar los grupos escondería los filtros activos y no habría forma de saber
   qué está recortando el catálogo sin abrirlos uno a uno. */
function resumenGrupo(clave) {
  if (clave === 'anios') {
    if (S.anioMin && S.anioMax) return `${S.anioMin}–${S.anioMax}`;
    if (S.anioMin) return `desde ${S.anioMin}`;
    if (S.anioMax) return `hasta ${S.anioMax}`;
    return '';
  }
  if (clave === 'imdbMin') return S.imdbMin ? `★ ${S.imdbMin}+` : '';
  if (clave === 'otros') {
    const t = [S.soloNuevas && 'novedades', S.soloFavs && 'mi lista',
      S.soloDirecta && 'directa'].filter(Boolean);
    return t.join(' · ');
  }
  const s = S[clave];
  if (!(s instanceof Set) || !s.size) return '';
  if (s.size === 1) {
    const v = [...s][0];
    return clave === 'decadas' ? v + 's' : String(v);
  }
  return s.size + ' elegidos';
}
function actualizarContadoresGrupo() {
  $$('[data-resumen]').forEach(el => {
    const txt = resumenGrupo(el.dataset.resumen);
    el.textContent = txt;
    el.closest('.fgroup')?.classList.toggle('tiene', !!txt);
  });
}

/* ---------- héroe ---------- */
// 9 segundos era poco: daba tiempo justo a leer el título y ya cambiaba
const HERO_MS = 16000;
let heroList = [], heroI = 0, heroTimer = null;
const heroMotivo = new Map();   // id → por qué está en el héroe
function construirHero(base = M) {
  /* El héroe se reparte en tres cajones para que no sea siempre lo mismo:
     3 novedades + 2 joyas del catálogo + 1 infantil. Antes sólo salían novedades
     bien valoradas, así que un clásico no asomaba nunca por bueno que fuera.
     Barajado de verdad (Fisher-Yates): `sort(() => Math.random() - .5)` parece
     que baraja pero no reparte parejo y repetía siempre las mismas. */
  const alAzar = (lista, n) => {
    const c = [...lista];
    for (let k = c.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [c[k], c[j]] = [c[j], c[k]];
    }
    return c.slice(0, n);
  };
  const luce = m => m.poster && m.sinopsis;
  // «Infantil» y «Familiar» tienen cinco títulos cada uno: muy pocos para elegir,
  // así que esa plaza la comparten con animación.
  const paraNiños = m => (m.generos || []).some(g => g === 'Infantil' || g === 'Familiar' || g === 'Animación');

  /* De cada elegida se guarda por qué está ahí, para decirlo en el rótulo en vez
     del genérico «Destacada». El motivo puede depender de la propia película:
     una joya de 1948 es un clásico, una de 2019 es mejor valorada. */
  const elegidas = new Map();
  const meter = (pelis, motivo) => pelis.forEach(m => {
    elegidas.set(m.id, m);
    if (!heroMotivo.has(m.id)) heroMotivo.set(m.id, typeof motivo === 'function' ? motivo(m) : motivo);
  });

  meter(alAzar(base.filter(m => luce(m) && m.imdb >= 7).slice(0, 40), 3), 'Recién añadida');
  meter(alAzar(base.filter(m => luce(m) && paraNiños(m) && m.imdb >= 6.5), 1), 'Familiar');
  meter(alAzar([...base].filter(m => luce(m) && m.imdb >= 8 && !elegidas.has(m.id))
                        .sort((a, b) => b.imdb - a.imdb).slice(0, 60), 2),
        m => (m.anio && m.anio < 1975 ? 'Clásico' : 'Mejor valorada'));

  heroList = alAzar([...elegidas.values()], 6);
  // Por si algún cajón se queda vacío, se completa con lo más reciente
  if (heroList.length < 6) {
    for (const m of base.filter(luce)) {
      if (heroList.length >= 6) break;
      if (!heroList.some(x => x.id === m.id)) heroList.push(m);
    }
  }
  if (!heroList.length) heroList = base.slice(0, 5);
  $('#hero').hidden = false;
  // El vitral se arma una sola vez; luego sólo se recolocan las láminas.
  $('#hero-vitral').innerHTML = heroList.map((m, i) =>
    `<button class="lamina" data-h="${i}" role="tab" title="${esc(m.titulo)}"
             aria-label="${esc(m.titulo)}">
       <img src="${esc(m.poster || m.thumb || '')}" alt="" onerror="this.style.opacity=0">
     </button>`).join('');
  pintarHero(0);
  clearInterval(heroTimer);
  heroTimer = setInterval(() => pintarHero((heroI + 1) % heroList.length), HERO_MS);
  // Cambiar de portada mientras alguien está leyendo la sinopsis es incómodo:
  // con el puntero encima, el carrusel espera.
  const h = $('#hero');
  h.addEventListener('pointerenter', () => clearInterval(heroTimer));
  h.addEventListener('pointerleave', () => {
    clearInterval(heroTimer);
    if (heroList.length > 1 && !h.hidden) {
      heroTimer = setInterval(() => pintarHero((heroI + 1) % heroList.length), HERO_MS);
    }
  });
}
/* Coloca las láminas del vitral alrededor de la que está activa: la de delante
   mirando de frente y las demás giradas hacia atrás, como fichas en un tarjetero.
   La distancia se mide en circular, así que el carrusel no tiene ni principio ni
   final. Las transformaciones se calculan aquí y no en CSS porque hace falta el
   valor absoluto de la distancia, que en hojas de estilo es incómodo. */
function colocarVitral(activo) {
  const n = heroList.length;
  $$('#hero-vitral .lamina').forEach((el, i) => {
    let d = i - activo;
    if (d > n / 2) d -= n;
    if (d < -n / 2) d += n;
    const lejos = Math.abs(d);
    const visible = lejos <= 2;
    el.hidden = !visible;
    if (!visible) return;
    // El translateZ no es decorativo: dentro de un contenedor con preserve-3d el
    // navegador ordena por posición en 3D, no por z-index, y los planos girados de
    // las vecinas se cruzaban por delante de la principal. Al ser translúcidas la
    // velaban y parecía que la de delante tenía transparencia. Separándolas en
    // profundidad, cada una queda donde debe.
    el.style.transform = `translate(-50%,-50%) translateX(${d * 40}%) ` +
      `translateZ(${-lejos * 120}px) rotateY(${-d * 32}deg) scale(${1 - lejos * 0.14})`;
    // Las de atrás bajan mucho: son ambiente, no compiten con la principal
    el.style.opacity = lejos === 0 ? 1 : lejos === 1 ? .34 : .15;
    el.style.filter = lejos === 0 ? 'none' : 'saturate(.4) brightness(.5)';
    el.style.zIndex = 10 - lejos;
    el.classList.toggle('on', lejos === 0);
    el.setAttribute('aria-selected', lejos === 0 ? 'true' : 'false');
  });
}

function pintarHero(i) {
  heroI = i;
  const m = heroList[i]; if (!m) return;
  const img = m.poster || m.thumb || '';
  $('#hero .bg').style.backgroundImage = `url('${img}')`;
  colocarVitral(i);
  /* «Novedad» habla de la película: estrenada hace dos años o menos. «Recién
     añadida» habla del catálogo: hace poco que está aquí, aunque sea de 1942.
     Son cosas distintas y antes se confundían. */
  const reciente = m.anio && m.anio >= new Date().getFullYear() - 2;
  $('#hero-eyebrow').textContent = reciente
    ? 'Novedad' : (heroMotivo.get(m.id) || 'Destacada');

  $('#hero-meta').innerHTML = [
    m.anio ? `<span class="chip">${m.anio}</span>` : '',

    ...(m.generos || []).slice(0, 3).map(g => `<span class="chip">${esc(g)}</span>`)

/* Extrae un color dominante del póster y lo lleva al fondo */
const tinteCache = new Map();
function tinteAmbiente(url) {
  if (!url) return;
  if (tinteCache.has(url)) return aplicarTinte(tinteCache.get(url));
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      const col = [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
      tinteCache.set(url, col); aplicarTinte(col);
    } catch {}
  };
  im.src = url;
}
function aplicarTinte([r, g, b]) {
  $('#ambient .orb.a').style.background = `rgb(${r},${g},${b})`;
  $('#ambient .orb.b').style.background = `rgb(${Math.round(b * .8)},${Math.round(r * .7)},${Math.round(g * .9)})`;
}

/* ---------- detalle ----------

   pulsa se transforma en la de la ficha en lugar de aparecer de golpe. Donde no
   exista —o si el sistema pide menos movimiento— se abre como siempre. */
const menosMovimiento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function abrirModal(id, autoplay, origen) {
  const m = M.find(x => x.id === id); if (!m) return;
  if (document.startViewTransition && origen && !menosMovimiento()) {

    // Dentro del callback se le quita el nombre a la carátula y se lo queda la
    // ficha: dos elementos no pueden llamarse igual a la vez o la transición falla.
    document.startViewTransition(() => {
      origen.style.viewTransitionName = '';
      pintarModal(m, autoplay);
    });
    return;
  }
  pintarModal(m, autoplay);
}

/* ---------- enlace directo a una ficha ----------
   .../cinefilos/#p<id> abre esa película nada más cargar. Lo usan los correos de
   novedades y sirve para compartir un título concreto. El prefijo «p» evita que
   el navegador confunda el identificador con el ancla de algún elemento.
   Se hace con el hash y no con history.pushState porque la página también tiene
   que funcionar abierta con file://, donde el historial da problemas. */
const idDelHash = () => (location.hash.match(/^#p(\d+)$/) || [])[1] || null;
let ignorarHash = false;

function ponerHash(valor) {
  ignorarHash = true;
  try {
    if (valor) location.hash = 'p' + valor;
    else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch { if (!valor) location.hash = ''; }   // file:// puede rechazar replaceState
  setTimeout(() => { ignorarHash = false; }, 0);
}

addEventListener('hashchange', () => {
  if (ignorarHash) return;
  const id = idDelHash();
  if (location.hash === '#cafe') App.abrirCafe();
  else if (id) abrirModal(id, false);
  else if ($('#cafe').classList.contains('on')) App.cerrarCafe();
  else if ($('#modal').classList.contains('open')) App.closeModal();
});
function reproducir(vid) {
  const p = $('#player');
  p.innerHTML = `<iframe src="https://ok.ru/videoembed/${encodeURIComponent(vid)}?autoplay=1"
    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
  p.classList.add('on');
  p.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- API pública ---------- */

       viendo» no aparecería hasta cambiar de sección. El héroe no: rehacerlo

    const sello = VIENDO.join(',');

  heroPasar(paso) {

     propio sistema, que ya trae WhatsApp y todo lo demás. Donde no lo haya —o si
     se cancela— se despliega la fila de enlaces de respaldo. */
  async compartir(id) {

        await navigator.share({ title: m.titulo, text: textoDe(m), url: enlaceDe(m) });

  toggleFavs() { S.soloFavs = !S.soloFavs; if (S.soloFavs) S.soloNuevas = false; this.aplicar(); scrollTo({top:0,behavior:'smooth'}); },
  toggleSeries() { S.soloSeries = !S.soloSeries; this.aplicar(); scrollTo({top:0,behavior:'smooth'}); },

  azar() {

  },
  set(patch) {
    Object.entries(patch).forEach(([k, v]) => {
      if (S[k] instanceof Set) { S[k].clear(); (Array.isArray(v) ? v : [v]).forEach(x => S[k].add(x)); }
      else S[k] = v;
    });
    construirFiltros(); this.aplicar(); scrollTo({ top: 0, behavior: 'smooth' });
  }
};

/* Copiar la llave de pago. El portapapeles moderno exige contexto seguro y no
   siempre lo hay abriendo el archivo con file://, así que si falla se recurre al
   truco de toda la vida: un textarea invisible y execCommand. Y si tampoco, al
   menos se deja el texto seleccionado para copiarlo a mano. */
async function copiarAlPortapapeles(boton) {
  const texto = boton.dataset.copiar;
  let ok = false;
  try {
    await navigator.clipboard.writeText(texto);
    ok = true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  // el botón de la llave tiene su etiqueta aparte; el de compartir es texto suelto
  const acc = boton.querySelector('.acc') || boton;
  const original = acc.textContent;
  if (ok) {
    boton.classList.add('copiada');
    acc.textContent = '¡Copiado!';
    clearTimeout(copiarAlPortapapeles._t);
    copiarAlPortapapeles._t = setTimeout(() => {
      boton.classList.remove('copiada');
      acc.textContent = original;
    }, 2200);
  } else {
    aviso(`Cópialo a mano: ${texto}`, 8000);
  }
}

    FAVS.has(id) ? FAVS.delete(id) : FAVS.add(id);

      b.textContent = b.classList.contains('btn-ghost') ? (on ? '♥ En mi lista' : '♡ Mi lista') : (on ? '♥' : '♡');
    });
    return;
  }
  const play = t.closest('[data-play]');
  if (play) { apuntarVisto(play.dataset.pel); reproducir(play.dataset.play); return; }

  // La fuente alternativa se abre en otra pestaña, pero también es empezar a ver
  const alt = t.closest('a.btn-alt[data-pel]');
  if (alt) { apuntarVisto(alt.dataset.pel); return; }   // sin return del enlace: sigue navegando

  const olvidar = t.closest('[data-olvidar]');
  if (olvidar) { olvidarVistos(); return; }

  const c = t.closest('.card');
  if (c) { abrirModal(c.dataset.id, false, c.querySelector('img')); return; }

  const rail = t.closest('[data-rail]');
  if (rail) {
    const el = document.getElementById(rail.dataset.rail);
    el.scrollBy({ left: (+rail.dataset.dir) * el.clientWidth * .82, behavior: 'smooth' });
    return;
  }
  const opt = t.closest('[data-set]');
  if (opt) {
    const k = opt.dataset.set;
    let v = opt.dataset.val;
    if (k === 'decadas') v = +v;
    S[k].has(v) ? S[k].delete(v) : S[k].add(v);
    opt.classList.toggle('on');
    App.aplicar();
    return;
  }
  const clr = t.closest('[data-clear]');
  if (clr) {
    const [k, v] = JSON.parse(clr.dataset.clear);
    if (S[k] instanceof Set) S[k].delete(k === 'decadas' ? +v : v);
    else S[k] = (k === 'imdbMin') ? 0 : (typeof S[k] === 'boolean' ? false : null);
    construirFiltros(); App.aplicar();
    return;
  }
  const copiar = t.closest('[data-copiar]');
  if (copiar) { copiarAlPortapapeles(copiar); return; }

  const more = t.closest('[data-more]');
  if (more) { App.set(JSON.parse(more.dataset.more)); return; }

  // enlaces dentro del detalle
  if (t.dataset.dirname) { App.closeModal(); App.set({ directores: [t.dataset.dirname] }); return; }
  if (t.dataset.gen) { App.closeModal(); App.set({ generos: [t.dataset.gen] }); return; }
  if (t.dataset.pais) { App.closeModal(); App.set({ paises: [t.dataset.pais] }); return; }
  if (t.dataset.dec) { App.closeModal(); App.set({ decadas: [+t.dataset.dec] }); return; }
  // En el vitral: la de los lados pasa al frente, y la que ya está delante abre
  // su ficha. Es lo que se espera al tocar el cartel principal.
  const lam = t.closest('[data-h]');
  if (lam) {
    const i = +lam.dataset.h;
    if (i === heroI) abrirModal(heroList[i].id, false, lam.querySelector('img'));
    else pintarHero(i);
    return;
  }
});

/* filtrar las listas largas del panel (país, director) */
document.addEventListener('input', e => {
  const fs = e.target.closest('[data-fsearch]');
  if (fs) {
    const q = fold(fs.value);
    $$(`[data-opts="${fs.dataset.fsearch}"] .opt`).forEach(o => {
      o.style.display = fold(o.dataset.val).includes(q) ? '' : 'none';
    });
  }
});

/* buscador con rebote */
let tq = null;
$('#q').addEventListener('input', e => {
  clearTimeout(tq);
  tq = setTimeout(() => {
    S.q = e.target.value;
    App.aplicar();
    // sube a los resultados: si el usuario estaba abajo, no se enteraría de si hubo o no
    if (scrollY > 0) scrollTo({ top: 0 });
  }, 160);
});

/* botón de volver arriba: aparece cuando ya se ha bajado un poco */
const btnTop = $('#top');
let topTick = false;
addEventListener('scroll', () => {
  if (topTick) return;
  topTick = true;
  requestAnimationFrame(() => {
    topTick = false;
    btnTop.classList.toggle('on', scrollY > 460);
  });
}, { passive: true });
$('#sort').addEventListener('change', e => { S.orden = e.target.value; pintarGrid(true); });

/* reflejo especular que sigue al puntero */
document.addEventListener('pointermove', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
  c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
}, { passive: true });

/* teclado */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') {
    if ($('#cafe').classList.contains('on')) App.cerrarCafe();
    else if ($('#modal').classList.contains('open')) App.closeModal();
    else if ($('#filters').classList.contains('open')) App.closeFilters();
  }
  if (e.key === 'Enter' && document.activeElement?.classList.contains('card')) {
    abrirModal(document.activeElement.dataset.id, false);
  }
});

function aviso(texto, ms = 4000, accion = null) {
  const t = $('#toast');
  t.innerHTML = `<span>${texto}</span>` + (accion ? `<button id="t-act">${accion.txt}</button>` : '') +
    `<button class="x" id="t-x">✕</button>`;
  t.classList.add('on');
  $('#t-x').onclick = () => t.classList.remove('on');
  if (accion) $('#t-act').onclick = () => { t.classList.remove('on'); accion.fn(); };
  clearTimeout(aviso._t);
  if (ms) aviso._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- aviso de novedades ---------- */
function avisoNovedades() {
  if (!NOVEDADES.size) return;
  const t = $('#toast');
  t.innerHTML = `<span>✦ <b>${NOVEDADES.size}</b> título${NOVEDADES.size === 1 ? '' : 's'} nuevo${NOVEDADES.size === 1 ? '' : 's'} desde tu última visita</span>
    <button id="t-ver">Ver</button><button class="x" id="t-x">✕</button>`;
  t.classList.add('on');
  $('#t-ver').onclick = () => { App.toggleNovedades(); t.classList.remove('on'); marcarVistas(); };
  $('#t-x').onclick = () => { t.classList.remove('on'); marcarVistas(); };
  setTimeout(() => t.classList.remove('on'), 14000);
}

/* ---------- arranque ---------- */
$('#new-count').textContent = NOVEDADES.size;
$('#btn-new').style.display = NOVEDADES.size ? '' : 'none';
construirTicker();
pintarCita();
$('#cita').addEventListener('click', pintarCita);
construirFiltros();
App.aplicar();   // arma portada y héroe de la sección que toque
// Si se ha llegado con un enlace directo, se abre lo que toque
if (idDelHash()) abrirModal(idDelHash(), false);
else if (location.hash === '#cafe') App.abrirCafe();
setTimeout(avisoNovedades, 1400);

</script>
