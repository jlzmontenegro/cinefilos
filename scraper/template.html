<style>
/* ============================================================
   SPATIAL UI — materiales translúcidos, profundidad y luz
   ============================================================ */
:root{
  --r-card: 22px; --r-panel: 28px; --r-pill: 999px;
  --ease: cubic-bezier(.22,1,.36,1);
  --nav-h: 64px;
  --glass: rgba(255,255,255,.07);
  --glass-hi: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.16);
  --stroke-soft: rgba(255,255,255,.08);
  --txt: #f2f3f7;
  --txt-dim: rgba(242,243,247,.62);
  --txt-faint: rgba(242,243,247,.38);
  --accent: #ffc400;        /* amarillo taxi */
  --accent-2: #ffd84d;
  --sobre-accent: #0a0a0a;   /* texto sobre amarillo */
  --new: #ffc400;
  --bg-0:#06070c; --bg-1:#0d1018;
  --shadow-lift: 0 32px 64px -20px rgba(0,0,0,.75), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-panel: 0 40px 90px -30px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
/* El atributo hidden tiene que ganarle a cualquier display de esta hoja: #hero
   es display:flex y con la regla del navegador a secas seguía viéndose durante
   la búsqueda, así que no se notaba si había resultados o no. */
[hidden]{display:none!important}
/* clip, no hidden: recorta el desbordamiento lateral sin crear un contenedor
   de scroll. Tiene que ser clip en html Y en body: basta con que uno de los dos
   sea hidden para que el navegador lo convierta en contenedor de scroll y la
   barra superior deje de quedarse pegada arriba al bajar. */
html{overflow-x:clip}
html,body{margin:0;padding:0;max-width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color:var(--txt); background:var(--bg-0); min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:clip;
  font-synthesis-weight:none;
}
/* Ambiente: dos orbes de color que reaccionan al contenido destacado ------- */
#ambient{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 60%)}
#ambient .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  transition:background 1.6s var(--ease), transform 2.4s var(--ease)}
#ambient .orb.a{width:60vw;height:60vw;left:-12vw;top:-18vw;background:#2a3f7a}
#ambient .orb.b{width:52vw;height:52vw;right:-14vw;top:8vh;background:#5a2a6e}
#ambient .grain{position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* Superficie de vidrio reutilizable --------------------------------------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(180%);
  backdrop-filter:blur(34px) saturate(180%);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow-panel), inset 0 1px 0 rgba(255,255,255,.16);
}

/* ---------------------------- BARRA SUPERIOR ---------------------------- */
#nav{position:sticky;top:0;z-index:60;height:var(--nav-h);display:flex;align-items:center;
  gap:14px;padding:0 clamp(14px,3vw,34px);
  background:color-mix(in srgb, var(--bg-0) 72%, transparent);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border-bottom:1px solid var(--stroke-soft)}
/* En versales el nombre necesita aire entre letras: apretado se lee peor. */
.brand{display:flex;align-items:center;font-weight:800;font-size:15px;
  text-transform:uppercase;letter-spacing:.14em;
  white-space:nowrap;cursor:pointer;user-select:none}

.search-wrap{flex:1 1 200px;min-width:150px;max-width:560px;position:relative;margin-inline:auto}
#q{width:100%;height:40px;border-radius:var(--r-pill);border:1px solid var(--stroke);
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  color:var(--txt);padding:0 40px 0 40px;font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .25s var(--ease),background .2s}
#q::placeholder{color:var(--txt-faint)}
#q:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search-wrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--txt-faint);pointer-events:none;display:flex}
/* Todos los iconos dibujados comparten trazo y tamaño, y toman el color del
   texto que tienen al lado: así encienden en amarillo con el botón activo. */
.nav-btn svg,.search-wrap .ic svg{width:17px;height:17px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.search-wrap .ic svg{width:16px;height:16px;stroke-width:1.8}
/* Cada icono con su tono, apagados a propósito: son manchas de 17 px sobre negro
   y con colores vivos volverían a parecer pegatinas. `currentColor` del trazo
   toma el `color` del propio svg, así que basta con teñirlo. */
/* El tono va en una variable del botón, no en el color del svg: así la regla del
   estado encendido puede ganarle. Puesto como `color` directo, los selectores por
   id le ganaban a `.nav-btn.on` y el icono se quedaba de color sobre el amarillo,
   sin contraste. */
.nav-btn svg{color:var(--tinte,currentColor)}
#btn-new{--tinte:var(--accent)}
#btn-series{--tinte:#7cc4ff}
#btn-fav{--tinte:#ff7a90}
#btn-azar{--tinte:#b39bfa}
#btn-cafe{--tinte:#e0a15c}
#btn-filtros{--tinte:#5ed6bb}
/* Encendido el fondo es amarillo: el icono vuelve al color del texto para que se
   lea. La especificidad (id + clase) es mayor que la del tono de arriba. */
#btn-new.on,#btn-series.on,#btn-fav.on{--tinte:currentColor}
/* El botón de sección enseña a dónde te lleva, no dónde estás: en Películas dice
   «Series» con el icono del televisor, y dentro de Series dice «Películas» con la
   claqueta. Sólo se ve uno de los dos iconos. */
#btn-series .i-pelis{display:none}
#btn-series.on .i-series{display:none}
#btn-series.on .i-pelis{display:block}
/* El corazón se rellena cuando la lista está activa */
#btn-fav.on svg{fill:currentColor}
.search-wrap .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--txt-faint);border:1px solid var(--stroke);border-radius:6px;
  padding:2px 6px;pointer-events:none}
#q:not(:placeholder-shown)~.kbd{display:none}

.acciones{display:flex;align-items:center;gap:10px}
.nav-btn{height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--stroke);
  background:var(--glass);color:var(--txt);font-size:13px;font-weight:550;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:transform .18s var(--ease),background .2s,border-color .2s}
.nav-btn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.nav-btn:active{transform:translateY(0) scale(.97)}
.nav-btn.on{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--sobre-accent)}
/* El café acompaña al resto de la barra y sólo se tiñe al pasar por encima */
#btn-cafe:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-pill);background:var(--new);
  color:var(--sobre-accent);font-size:11px;font-weight:800;display:inline-grid;place-items:center}

/* ------------------------------- HÉROE ---------------------------------- */
/* El texto va centrado en vertical (alineado a la izquierda, pero a media altura).
   El vitral no se entera: lleva su propio align-self:stretch. */
#hero{position:relative;margin:clamp(12px,2vw,22px) clamp(14px,3vw,34px) 8px;
  border-radius:var(--r-panel);overflow:hidden;min-height:clamp(300px,42vw,440px);
  display:flex;align-items:center;isolation:isolate;box-shadow:var(--shadow-panel)}
/* ok.ru sólo sirve pósters de 202x300 y no acepta pedir otro tamaño. Estirar eso
   a lo ancho de la pantalla son casi diez aumentos, y se veía el grano. Como el
   fondo es sólo ambiente, se difumina de verdad: así deja de ser una foto ampliada
   y pasa a ser una mancha de color. El escalado extra tapa el borde que el
   desenfoque deja transparente. La imagen nítida va aparte, en el cartel. */
#hero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;
  transform:scale(1.3);filter:blur(28px) saturate(150%) brightness(.92);
  transition:opacity .7s var(--ease)}
/* El vitral: las destacadas como láminas de vidrio en perspectiva. La de delante
   se ve de frente y a todo color; las de los lados quedan giradas, apagadas y
   detrás, como fichas en un tarjetero. Sirve de cartel y de control a la vez. */
/* Las flechas van fuera del vitral, en un envoltorio sin `preserve-3d`: dentro
   competirían en profundidad con las láminas y quedarían tapadas.
   `align-self:stretch` y nada de altura en porcentaje: el héroe se dimensiona con
   `min-height`, así que un `height:%` aquí no resuelve y el contenedor se quedaba
   con altura cero — las láminas se amontonaban arriba. */
#hero .vitral-wrap{position:relative;flex:0 0 auto;align-self:stretch;z-index:1;
  width:clamp(250px,36vw,380px);display:flex;align-items:center}
#hero .vitral{position:relative;width:100%;height:100%;
  perspective:1100px;transform-style:preserve-3d}
/* Sólo el signo, sin botón alrededor: la sombra basta para que se lea también
   cuando cae sobre una carátula clara. */
#hero .v-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:30px;height:46px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;
  color:rgba(255,255,255,.6);font-size:30px;line-height:1;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
  opacity:0;transition:opacity .25s,color .2s,transform .2s var(--ease)}
#hero:hover .v-btn,#hero .v-btn:focus-visible{opacity:1}
#hero .v-btn:hover{color:#fff;transform:translateY(-50%) scale(1.18)}
#hero .v-btn.l{left:-8px} #hero .v-btn.r{right:-8px}
/* Sin ratón no hay hover que valga: en táctil se ven siempre */
@media(hover:none){#hero .v-btn{opacity:.85}}
#hero .lamina{position:absolute;left:50%;top:50%;margin:0;padding:0;cursor:pointer;
  width:clamp(120px,19vw,210px);aspect-ratio:2/3;border-radius:10px;overflow:hidden;
  background:#0d1018;border:1px solid rgba(255,255,255,.18);
  box-shadow:0 26px 50px -18px rgba(0,0,0,.85);
  transition:transform .62s var(--ease),opacity .62s var(--ease),filter .62s var(--ease)}
#hero .lamina img{width:100%;height:100%;object-fit:cover;display:block}
/* El brillo diagonal es lo que le da el aire de vidrio */
#hero .lamina::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(128deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.05) 32%,
             transparent 52%,rgba(255,255,255,.08) 100%)}
/* La de delante va limpia: sin velo de vidrio encima. El brillo es lo que hace
   que las de atrás parezcan láminas, pero sobre la principal la deslucía. */
/* La principal, opaca del todo y sin nada encima: ni velo, ni filtro, ni borde
   translúcido, que el canto de vidrio también la hacía parecer transparente. */
#hero .lamina.on{opacity:1;filter:none;border-color:#f2f3f7;
  box-shadow:0 34px 60px -20px rgba(0,0,0,.9)}
#hero .lamina.on::after{display:none}
#hero .lamina[hidden]{display:none!important}
#hero .scrim{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(78deg,rgba(3,5,10,.94) 0%,rgba(3,5,10,.72) 42%,rgba(3,5,10,.15) 78%),
             linear-gradient(0deg,rgba(3,5,10,.9),transparent 55%)}
#hero .inner{padding:clamp(20px,3.2vw,42px);max-width:min(680px,88%);display:flex;flex-direction:column;gap:12px}
#hero .eyebrow{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#hero h1{margin:0;font-size:clamp(26px,4.4vw,50px);line-height:1.03;letter-spacing:-.035em;font-weight:800}
#hero .orig{font-size:13px;color:var(--txt-dim);margin:-4px 0 0}
#hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#hero p.syn{margin:0;font-size:14.5px;line-height:1.55;color:var(--txt-dim);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn-primary{height:44px;padding:0 22px;border-radius:var(--r-pill);border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);font-size:14.5px;font-weight:650;
  display:inline-flex;align-items:center;gap:9px;
  box-shadow:0 14px 34px -12px color-mix(in srgb,var(--accent) 75%,transparent);
  transition:transform .18s var(--ease),box-shadow .25s var(--ease)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 46px -14px color-mix(in srgb,var(--accent) 85%,transparent)}
.btn-ghost{height:44px;padding:0 20px;border-radius:var(--r-pill);cursor:pointer;
  border:1px solid var(--stroke);background:var(--glass);color:var(--txt);font-size:14.5px;font-weight:600;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:inline-flex;align-items:center;gap:9px;transition:transform .18s var(--ease),background .2s}
.btn-ghost:hover{background:var(--glass-hi);transform:translateY(-2px)}
/* La fuente alternativa también reproduce, así que se viste del color de
   «Reproducir» en vez del gris de «Mi lista» o «Compartir»: sigue siendo
   secundaria —va en contorno, no en relleno— pero se ve que es para ver la peli. */
.btn-alt{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.btn-alt:hover{color:var(--sobre-accent);background:var(--accent);border-color:transparent}

/* ------------------------------- CHIPS ---------------------------------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;
  border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--glass);
  font-size:11.5px;font-weight:600;color:var(--txt-dim);white-space:nowrap}
.chip.solid{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);border-color:transparent}
.chip.new{background:var(--new);color:var(--sobre-accent);border-color:transparent;font-weight:800}
.chip.star{color:#f5c451;border-color:color-mix(in srgb,#f5c451 34%,transparent)}
/* Qué trae la serie. Verde cuando el vídeo llega al último episodio declarado,
   ámbar cuando se queda corto; gris cuando no se puede afirmar ninguna de las dos. */
.chip.eps{color:#bcd9ff;border-color:rgba(160,200,255,.45)}
.chip.eps.completa{color:#8fe0b0;border-color:rgba(143,224,176,.5)}
.chip.eps.parcial{color:#ffce9b;border-color:rgba(255,180,110,.5)}

/* ------------------------- FILAS TIPO CARRUSEL --------------------------- */
main{padding:0 0 90px}
.row{margin:clamp(18px,2.6vw,34px) 0}
.row-head{display:flex;align-items:baseline;gap:12px;padding:0 clamp(14px,3vw,34px);margin-bottom:12px}
.row-head h2{margin:0;font-size:clamp(16px,1.7vw,21px);font-weight:700;letter-spacing:-.02em}
.row-head .count{font-size:12px;color:var(--txt-faint);font-weight:500}
.row-head .more{margin-left:auto;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;
  opacity:0;transition:opacity .25s}
.row:hover .row-head .more{opacity:1}
.rail-wrap{position:relative}
/* El scroll-padding es imprescindible, no decorativo: sin él, el imán del
   scroll-snap alinea la primera carátula con el borde del contenedor y se come
   el margen, dejando las tarjetas pegadas al canto de la pantalla mientras el
   título de la fila sí guardaba su distancia. */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;
  padding:14px clamp(14px,3vw,34px) 22px;
  scroll-padding-inline:clamp(14px,3vw,34px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
/* La fila reserva su altura mientras está vacía, que si no el contenido de abajo
   sube y baja según se van pintando y el scroll da saltos. */
.rail:empty{min-height:calc(var(--cw,168px) * 1.5)}
.rail-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--stroke);background:var(--glass);color:var(--txt);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);cursor:pointer;display:grid;place-items:center;
  opacity:0;transition:opacity .25s,transform .2s var(--ease);font-size:17px}
.rail-wrap:hover .rail-btn{opacity:1}
.rail-btn:hover{transform:translateY(-50%) scale(1.1);background:var(--glass-hi)}
.rail-btn.l{left:clamp(6px,1.4vw,16px)} .rail-btn.r{right:clamp(6px,1.4vw,16px)}
@media (hover:none){.rail-btn{display:none}}

/* -------------------------------- TARJETA -------------------------------- */
.card{position:relative;flex:0 0 auto;width:var(--cw,168px);cursor:pointer;
  transform-style:preserve-3d;transition:transform .34s var(--ease)}
.card .shell{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:2/3;
  background:#12151f;border:1px solid var(--stroke-soft);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
  transition:box-shadow .34s var(--ease),border-color .3s}
.card .fill{position:absolute;inset:-14%;background-size:cover;background-position:center;
  filter:blur(22px) saturate(150%) brightness(.8);transform:scale(1.1)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  transition:transform .5s var(--ease);background:transparent}
/* Póster caído: ok.ru firma los enlaces de imagen y los caduca (410) al cabo de
   un año, así que la tarjeta se dibuja con fondo propio en vez de quedarse
   con el hueco roto del navegador. */
.card .shell.sin-poster{background:linear-gradient(155deg,#242b40,#12151f 62%)}
.card .shell.sin-poster::before{content:'🎞';position:absolute;inset:0 0 24% 0;display:grid;
  place-items:center;font-size:30px;opacity:.3}
#modal .poster.sin-poster{background:linear-gradient(155deg,#242b40,#12151f 62%)}
#modal .poster.sin-poster::before{content:'🎞';position:absolute;inset:0;display:grid;
  place-items:center;font-size:30px;opacity:.3}
.card .spec{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 62%)}
.card:hover{transform:translateY(-8px) scale(1.035)}
.card:hover .shell{box-shadow:var(--shadow-lift);border-color:var(--stroke)}
.card:hover img{transform:scale(1.07)}
.card:hover .spec{opacity:1}
.card .tags{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:5px;flex-wrap:wrap;z-index:2}
/* Las etiquetas van sobre el póster: siempre vidrio oscuro, sin importar el tema */
.card .tags .chip{background:rgba(5,7,14,.62);border-color:rgba(255,255,255,.2);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card .tags .chip.star{color:#f7cf6a;border-color:rgba(247,207,106,.42)}
.card .tags .chip.new{background:var(--new);color:var(--sobre-accent);border-color:transparent}
/* Marca de serie: al buscar salen mezcladas con películas y hay que distinguirlas.
   Dentro de la sección de Series sobra, y allí se esconde. */
.card .tags .chip.serie{background:rgba(120,180,255,.22);color:#bcd9ff;
  border-color:rgba(160,200,255,.45)}
/* …pero sólo cuando dice «Serie» a secas. Si lleva el tramo de episodios («T1 ·
   E1-8 de 8») es justo el dato que hace falta dentro de Series, así que se queda. */
body.en-series .card .tags .chip.serie:not(.eps){display:none}
.card .tags .chip.serie.parcial{background:rgba(255,170,90,.2);color:#ffce9b;
  border-color:rgba(255,180,110,.45)}
.card .fav{position:absolute;top:9px;right:9px;z-index:3;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--stroke);background:rgba(10,12,20,.5);-webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;font-size:13px;cursor:pointer;
  opacity:0;transform:scale(.8);transition:all .25s var(--ease)}
.card:hover .fav,.card .fav.on{opacity:1;transform:scale(1)}
.card .fav.on{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--sobre-accent)}
.card .foot{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 11px;z-index:2;
  background:linear-gradient(0deg,rgba(4,6,12,.94) 8%,rgba(4,6,12,.66) 48%,transparent);
  opacity:.94;transition:opacity .3s var(--ease)}
.card:hover .foot{opacity:1}
.card .foot b{display:block;font-size:13.5px;font-weight:700;line-height:1.22;color:#fff;
  letter-spacing:-.012em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot span{display:block;font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dur{position:absolute;bottom:9px;right:9px;z-index:3;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:6px;background:rgba(4,6,12,.7);color:#fff;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.card:hover .dur{opacity:0}

/* ------------------------ EL CATÁLOGO EN CIFRAS -------------------------- */
.cifras{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
  margin-bottom:26px;padding-bottom:24px;border-bottom:1px solid var(--stroke-soft)}
.cifras span{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-faint)}
.cifras b{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--txt);
  text-transform:none;letter-spacing:-.01em}

/* -------------------------------- CIERRE --------------------------------- */
/* El pie es ancho para que las cifras quepan en una fila; el párrafo se queda
   estrecho aparte, que una línea de texto larguísima no se lee bien. */
#cierre{padding:54px clamp(14px,3vw,34px) 40px;text-align:center;
  font-size:13.5px;line-height:1.7;color:var(--txt-dim);max-width:860px;margin:0 auto}
#cierre p{margin:0 auto;max-width:56ch}
/* La cita. Las comillas van dibujadas con ::before/::after y no en el texto, así
   el propio texto sigue siendo copiable y buscable sin ellas. */
#cita{margin:30px auto 0;max-width:52ch;cursor:pointer;
  transition:opacity .3s var(--ease)}
#cita:hover{opacity:.72}
#cita p{margin:0;font-size:16px;line-height:1.55;color:var(--txt);
  font-weight:450;letter-spacing:-.01em;text-wrap:balance}
#cita p.repl{font-style:italic}
#cita p::before{content:'“'} #cita p::after{content:'”'}
#cita cite{display:block;margin-top:10px;font-style:normal;font-size:11.5px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#cita cite::before{content:'— '}
@media(max-width:640px){#cita p{font-size:15px}}
/* Apoyo al proyecto: apagado hasta que se pasa por encima, para que esté ahí
   sin pedir nada a gritos. */
.apoyo{display:inline-flex;align-items:center;gap:8px;margin-top:24px;height:34px;padding:0 16px;
  border-radius:var(--r-pill);border:1px solid var(--stroke-soft);background:transparent;
  color:var(--txt-faint);font-size:12.5px;font-weight:600;text-decoration:none;
  transition:color .25s var(--ease),border-color .25s var(--ease),
             background .25s var(--ease),transform .25s var(--ease)}
.apoyo span{font-size:14px;filter:grayscale(1);opacity:.7;transition:filter .25s var(--ease),opacity .25s var(--ease)}
.apoyo:hover{color:var(--accent);transform:translateY(-1px);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.apoyo:hover span{filter:none;opacity:1}
.apoyo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ------------------------------- REJILLA -------------------------------- */
#grid-view{padding:0 clamp(14px,3vw,34px)}
/* Más aire y carátulas algo mayores: con imágenes de 202x300 apretarlas sólo
   hace que se noten pequeñas. Mejor menos por fila y que respiren. */
.grid{display:grid;gap:clamp(16px,2vw,26px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(142px,15vw,196px),1fr))}
.grid .card{width:auto}
/* Encabezado de grupo dentro de los resultados (Películas / Series) */
.grid .grupo{grid-column:1/-1;margin:6px 0 -4px;display:flex;align-items:baseline;gap:10px;
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-faint)}
.grid .grupo:not(:first-child){margin-top:22px;padding-top:20px;border-top:1px solid var(--stroke-soft)}
.grid .grupo span{font-size:11.5px;font-weight:600;letter-spacing:.02em;
  text-transform:none;color:var(--txt-faint);opacity:.75}
/* Cabecera de resultados: centrada, para que el término buscado y el número de
   coincidencias sean lo primero que se lee al terminar de escribir. */
.results-bar{display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:clamp(24px,3.4vw,40px) 0 clamp(16px,2.2vw,24px);text-align:center}
.results-bar::after{content:'';width:min(260px,55%);height:1px;
  background:linear-gradient(90deg,transparent,var(--stroke),transparent)}
.res-info{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.results-bar .linea{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.results-bar h2{margin:0;font-size:clamp(21px,3vw,33px);font-weight:800;letter-spacing:-.032em;
  line-height:1.15;max-width:22ch;overflow-wrap:anywhere}
.results-bar h2 .term{color:var(--accent)}
.results-bar .sub{font-size:13px;color:var(--txt-faint)}
.res-tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:100%}
/* Marcador de resultados: se ve de un vistazo si la búsqueda encontró algo */
.res-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 15px;
  border-radius:var(--r-pill);font-size:12.5px;font-weight:750;white-space:nowrap;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.res-pill.vacio{background:rgba(255,88,88,.15);color:#ff9f9f;border-color:rgba(255,88,88,.42)}
.res-pill:empty{display:none}
select.sel{height:34px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--glass);
  color:var(--txt);font-size:12.5px;padding:0 30px 0 13px;cursor:pointer;outline:none;font-weight:550;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
select.sel option{background:#12151f;color:#f2f3f7}
.active-filters{display:flex;gap:7px;flex-wrap:wrap}
.af{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 12px;border-radius:var(--r-pill);
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);font-size:11.5px;font-weight:650}
.af b{opacity:.75;font-weight:600}
.af button{background:rgba(0,0,0,.24);border:none;color:var(--sobre-accent);width:17px;height:17px;border-radius:50%;
  cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
#sentinel{height:60px;display:grid;place-items:center;color:var(--txt-faint);font-size:12.5px}
.empty{text-align:center;padding:70px 20px 90px;color:var(--txt-dim)}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.5}
.empty b{display:block;font-size:clamp(17px,2.2vw,22px);color:var(--txt);font-weight:750;
  letter-spacing:-.02em;margin-bottom:8px}
.empty b .term{color:var(--accent)}
.empty p{margin:0 auto;max-width:46ch;font-size:14px;line-height:1.6}
.empty .btn-primary{margin-top:22px}

/* ------------------------------ EL CAFÉ ---------------------------------- */
#cafe{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
#cafe.on{display:flex}
#cafe .back{position:absolute;inset:0;background:rgba(2,3,8,.66);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#cafe .caja{position:relative;width:min(420px,100%);border-radius:var(--r-panel);
  padding:26px 24px 22px;text-align:center;animation:rise .42s var(--ease) both}
#cafe .taza{font-size:38px;line-height:1}
#cafe h3{margin:10px 0 6px;font-size:19px;font-weight:750;letter-spacing:-.02em}
#cafe p{margin:0 0 18px;font-size:13.5px;line-height:1.6;color:var(--txt-dim)}
#cafe small{display:block;margin-top:16px;font-size:11.5px;color:var(--txt-faint)}
/* Cada medio de pago: a la izquierda quién es, a la derecha la acción */
#cafe .opcion{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  padding:13px 14px;margin-bottom:10px;border-radius:16px;border:1px solid var(--stroke-soft);
  background:rgba(255,255,255,.04);text-decoration:none;color:var(--txt)}
#cafe .opcion:last-of-type{margin-bottom:0}
#cafe .quien{flex:1;min-width:0}
#cafe .quien b{display:block;font-size:14px;font-weight:700}
#cafe .quien span{display:block;font-size:11.5px;color:var(--txt-faint);margin-top:2px}
#cafe .donde{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--txt-faint);border:1px solid var(--stroke-soft);
  border-radius:var(--r-pill);padding:1px 7px;margin-left:6px;vertical-align:1px}
#cafe .llave,#cafe .ir{flex:0 0 auto;border-radius:var(--r-pill);cursor:pointer;
  font-size:12.5px;font-weight:700;white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);
  padding:8px 14px;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
#cafe .llave:hover,#cafe .opcion.enlace:hover .ir{background:color-mix(in srgb,var(--accent) 24%,transparent)}
#cafe .llave .acc{font-size:10.5px;font-weight:650;opacity:.75;
  border-left:1px solid color-mix(in srgb,var(--accent) 38%,transparent);padding-left:8px}
#cafe .llave.copiada{background:var(--accent);color:var(--sobre-accent);border-color:transparent}
#cafe .llave.copiada .acc{opacity:1;border-color:rgba(0,0,0,.25)}
@media(max-width:420px){
  #cafe .opcion{flex-direction:column;align-items:flex-start;gap:10px}
  #cafe .llave,#cafe .ir{width:100%;justify-content:center}
}

/* --------------------------- VOLVER ARRIBA ------------------------------ */
#top{position:fixed;right:clamp(14px,3vw,34px);bottom:clamp(18px,3vw,28px);z-index:55;
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--stroke);background:var(--glass);color:var(--txt);font-size:18px;line-height:1;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-lift);
  opacity:0;visibility:hidden;transform:translateY(14px) scale(.9);
  transition:opacity .28s var(--ease),transform .28s var(--ease),
             visibility 0s linear .28s,background .2s}
#top.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#top:hover{background:var(--glass-hi);transform:translateY(-3px)}
#top:active{transform:scale(.93)}
@media(max-width:640px){#top{width:44px;height:44px;bottom:16px;font-size:17px}}

/* ---------------------------- PANEL DE FILTROS --------------------------- */
/* El panel vive fuera de la pantalla mientras está cerrado. Además de moverlo
   con transform hay que ocultarlo: si sigue siendo visible, los navegadores
   móviles lo cuentan como contenido y aparece una franja muerta a la derecha.
   La visibilidad se retrasa lo que dura la animación para no cortar el cierre. */
#filters{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);z-index:80;
  border-radius:var(--r-panel) 0 0 var(--r-panel);display:flex;flex-direction:column;
  transform:translateX(102%);will-change:transform;visibility:hidden;
  transition:transform .46s var(--ease), visibility 0s linear .46s}
#filters.open{transform:none;visibility:visible;
  transition:transform .46s var(--ease), visibility 0s linear 0s}
#filters header{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--stroke-soft)}
#filters header h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1}
#filters .tirador{display:none}
/* `overscroll-behavior:contain` evita que al llegar al final de la lista el gesto
   siga arrastrando la página de detrás, que es lo que pasaba en el móvil. */
#filters .body{overflow-y:auto;padding:10px 16px 16px;flex:1;scrollbar-width:thin;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#filters footer{padding:14px 18px;border-top:1px solid var(--stroke-soft);display:flex;gap:10px}

/* Cada grupo es una tarjeta plegable. Abiertos todos a la vez el panel medía
   3,5 pantallas y sólo los 38 géneros llenaban lo visible. */
.fgroup{border:1px solid var(--stroke-soft);border-radius:15px;background:var(--glass);
  margin:9px 0;overflow:hidden;transition:border-color .25s,background .25s}
.fgroup[open]{background:var(--glass-hi)}
.fgroup.tiene{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.fgroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:0 14px;min-height:48px;user-select:none;transition:background .2s}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary:hover{background:var(--glass-hi)}
.fgroup>summary .tit{font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.fgroup>summary .elegido{margin-left:auto;min-width:0;font-size:11.5px;font-weight:600;
  color:var(--accent);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Galón dibujado con bordes: nada de fuentes de iconos ni de un SVG por grupo. */
.fgroup>summary::after{content:"";flex:0 0 auto;width:7px;height:7px;margin-left:5px;
  border-right:2px solid var(--txt-faint);border-bottom:2px solid var(--txt-faint);border-radius:1px;
  transform:rotate(45deg) translateY(-2px);transition:transform .25s var(--ease)}
.fgroup[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.fgroup .dentro{padding:2px 14px 14px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--r-pill);
  border:1px solid var(--stroke);background:var(--glass);color:var(--txt-dim);font-size:12px;font-weight:550;
  cursor:pointer;transition:all .2s var(--ease);user-select:none}
.opt:hover{background:var(--glass-hi);color:var(--txt)}
.opt.on{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);border-color:transparent}
.opt .c{font-size:10px;opacity:.6}
.opt.on .c{opacity:.8}
.fsearch{width:100%;height:34px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--glass);
  color:var(--txt);padding:0 14px;font-size:12.5px;outline:none;margin-bottom:10px}
.fsearch:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.scrolly{max-height:216px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  padding:2px 4px 2px 0}
.rng{display:flex;align-items:center;gap:11px;padding:3px 0}
.rng>span{font-size:12px;color:var(--txt-faint);min-width:42px}
.rng input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:22px}
.rng output{font-size:12px;font-weight:700;min-width:42px;text-align:right;color:var(--accent)}
.toggles{display:flex;flex-direction:column;gap:9px}
.tg{display:flex;align-items:center;gap:11px;cursor:pointer;font-size:13px;font-weight:550}
.tg input{appearance:none;width:40px;height:23px;border-radius:var(--r-pill);background:var(--stroke);
  position:relative;cursor:pointer;transition:background .25s;flex:0 0 auto;border:1px solid var(--stroke-soft)}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:transform .28s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tg input:checked{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent}
.tg input:checked::after{transform:translateX(17px)}
/* En escritorio ancho el cajón se ensancha: los chips de país y director caben
   en menos filas y se ve más lista sin desplazar. */
@media(min-width:1280px){#filters{width:min(480px,42vw)}}

/* En el móvil un cajón lateral tapa la pantalla entera y deja el pulgar lejos de
   todo. Ahí es hoja inferior: entra desde abajo, ocupa lo que necesita hasta 88vh
   y el botón de «Ver N títulos» queda donde alcanza el dedo. */
@media(max-width:640px){
  #filters{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88vh;
    border-radius:22px 22px 0 0;transform:translateY(102%)}
  #filters .tirador{display:block;flex:0 0 auto;width:40px;height:4px;border-radius:2px;
    background:var(--stroke);margin:10px auto 2px}
  #filters header{padding:8px 16px 10px}
  #filters header h3{font-size:16px}
  #filters footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .fgroup>summary{min-height:52px}
  .opt{height:34px;font-size:12.5px}
  .scrolly{max-height:min(216px,34vh)}
}

#scrim{position:fixed;inset:0;z-index:70;background:rgba(3,5,11,.55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
#scrim.on{opacity:1;pointer-events:auto}

/* -------------------------------- DETALLE -------------------------------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px}
#modal.open{display:flex}
#modal .back{position:absolute;inset:0;background:rgba(2,3,8,.72);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}
/* La ficha sólo se desplaza en vertical. Sin este overflow-x, la fila de
   recomendadas desbordaba y era la ficha entera la que se movía de lado: el
   título se salía por la izquierda y quedaba un hueco negro a la derecha. */
#modal .sheet{position:relative;width:min(1020px,100%);max-height:min(92vh,940px);
  overflow-y:auto;overflow-x:hidden;
  border-radius:var(--r-panel);scrollbar-width:thin;
  animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(38px) scale(.965)}to{opacity:1;transform:none}}
#modal .hd{position:relative;min-height:clamp(190px,26vw,290px);display:flex;align-items:flex-end;
  border-radius:var(--r-panel) var(--r-panel) 0 0;overflow:hidden}
#modal .hd .bg{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(14px) saturate(150%);transform:scale(1.2)}
#modal .hd .sc{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,8,16,.97),rgba(6,8,16,.5) 60%,rgba(6,8,16,.3))}
#modal .hd .in{position:relative;display:flex;gap:20px;padding:22px clamp(18px,2.6vw,30px);width:100%;align-items:flex-end}
/* Es la que recoge el testigo de la carátula al abrir la ficha */
#modal.open .poster{view-transition-name:caratula}
::view-transition-old(caratula),::view-transition-new(caratula){
  animation-duration:.42s;mix-blend-mode:normal}
::view-transition-group(caratula){animation-timing-function:cubic-bezier(.22,1,.36,1)}
#modal .poster{flex:0 0 auto;width:clamp(96px,11vw,142px);aspect-ratio:2/3;border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow-lift);border:1px solid var(--stroke);position:relative;background:#12151f}
#modal .poster .fill{position:absolute;inset:-14%;background-size:cover;background-position:center;filter:blur(18px)}
#modal .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#modal .ttl{flex:1;min-width:0}
#modal .ttl h2{margin:0 0 4px;font-size:clamp(20px,2.9vw,33px);line-height:1.06;letter-spacing:-.032em;font-weight:800}
#modal .ttl .oname{font-size:13px;color:var(--txt-dim);margin-bottom:10px}
#modal .ttl .meta{display:flex;flex-wrap:wrap;gap:7px}
#modal .bd{padding:clamp(18px,2.6vw,30px);display:grid;gap:22px;
  grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media(max-width:780px){#modal .bd{grid-template-columns:1fr}}
#modal .syn{font-size:14.5px;line-height:1.68;color:var(--txt-dim);margin:0}
#modal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
/* Respaldo de compartir, para cuando el sistema no trae su propio menú */
.redes{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}
.redes a,.redes button{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:var(--r-pill);
  border:1px solid var(--stroke-soft);background:var(--glass);color:var(--txt-dim);
  text-decoration:none;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.redes a:hover,.redes button:hover{color:var(--accent);background:var(--glass-hi);
  border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.redes button.copiada{background:var(--accent);color:var(--sobre-accent);border-color:transparent}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13.5px;align-items:baseline}
.dl dt{color:var(--txt-faint);font-weight:600;white-space:nowrap}
.dl dd{margin:0;color:var(--txt);font-weight:500}
.dl dd .lnk{color:var(--accent);cursor:pointer}
.dl dd .lnk:hover{text-decoration:underline}
#player{margin-top:16px;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#05070d;
  border:1px solid var(--stroke);display:none}
#player.on{display:block}
#player iframe{width:100%;height:100%;border:0;display:block}
.close-x{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--stroke);background:rgba(8,10,18,.55);color:#fff;cursor:pointer;font-size:16px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center}
.close-x:hover{background:rgba(8,10,18,.8)}
/* Las celdas tienen que poder encogerse por debajo de su contenido; si no, la
   fila de recomendadas ensancha la rejilla y arrastra toda la ficha. */
#modal .bd > *{min-width:0}
.related{display:flex;gap:11px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.related::-webkit-scrollbar{display:none}
.related .card{width:104px}

/* ------------------------------ NOVEDADES -------------------------------- */
/* El ancho hay que decirlo: con `left:50%` y sin más, el aviso sólo puede ocupar
   lo que queda hasta el borde derecho — media pantalla — y en el móvil el texto
   se partía en una columna de seis líneas. */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:120;
  width:max-content;max-width:min(92vw,440px);
  padding:13px 20px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:12px;transition:transform .5s var(--ease)}
#toast span{min-width:0}
#toast.on{transform:translate(-50%,0)}
/* El aviso va por encima de todo (z-index 120) y se plantaba justo sobre el botón
   «Ver N títulos» del panel: en el móvil lo tapaba entero. Mientras el panel está
   abierto se retira, y vuelve al cerrarlo. */
body.panel-abierto #toast.on{transform:translate(-50%,140%);pointer-events:none}
#toast button{border:none;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);
  height:30px;padding:0 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:650;cursor:pointer}
#toast .x{background:none;color:var(--txt-faint);padding:0 4px;font-size:15px}

/* ------------------------------ RESPONSIVE ------------------------------- */
@media(max-width:1060px){
  .nav-btn .lbl{display:none}
  .nav-btn{padding:0 11px}
}
@media(max-width:900px){
  :root{--nav-h:58px}
  #hero{min-height:340px}
  #hero .inner{max-width:100%}
  #modal{padding:0}
  /* A pantalla completa la ficha llegaba pegada al borde de arriba, debajo de la
     hora y la muesca del móvil. Se le reserva ese hueco. */
  #modal .sheet{max-height:100vh;height:100vh;border-radius:0;
    padding-top:max(18px,env(safe-area-inset-top))}
  #modal .hd{border-radius:0}
  /* A pantalla completa la X quedaba rozando el borde: se baja para que respire
     y no compita con la hora ni la muesca del móvil. */
  #modal .close-x{top:max(30px,calc(env(safe-area-inset-top) + 20px));right:18px}
}
@media(max-width:640px){
  /* La barra no cabe en una fila: el buscador pasa a la suya y los botones
     quedan accesibles. Antes el último se salía de la pantalla y, como el body
     recorta el desbordamiento, no había forma de pulsarlo. */
  /* Dos filas y no tres: arriba la marca con el buscador, y debajo los botones en
     una tira que se desliza. Seis botones más el nombre no caben en 375 px, y al
     envolverse dejaban uno descolgado en una tercera fila él solo. Como tira, da
     igual cuántos botones haya: nunca se parte. */
  :root{--nav-h:104px; --cw:clamp(116px,35vw,150px)}
  #nav{flex-wrap:wrap;height:auto;min-height:var(--nav-h);
       align-content:center;gap:10px;padding-block:10px}
  .brand{font-size:13px;letter-spacing:.12em;flex:0 0 auto}
  /* base pequeña para que el buscador encoja junto a la marca en vez de saltar
     a una fila propia en pantallas muy estrechas */
  .search-wrap{flex:1 1 90px;max-width:none;margin-inline:0;min-width:0}
  /* `safe center` y no `center` a secas: con la tira desbordada, centrar de la
     forma normal recorta el principio y deja el primer botón fuera de alcance.
     Con `safe` se centra sólo cuando cabe y, si no, arranca desde la izquierda. */
  .acciones{order:9;flex:1 0 100%;gap:8px;justify-content:safe center;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    /* que la tira pueda llegar a los bordes de la pantalla al deslizarse */
    margin-inline:calc(-1 * clamp(14px,3vw,34px));padding-inline:clamp(14px,3vw,34px)}
  .acciones::-webkit-scrollbar{display:none}
  .acciones .nav-btn{flex:0 0 auto}
  #hero{min-height:0}
  #hero .cta .btn-ghost{display:none}
  #hero .inner{padding:18px}
  .row-head{gap:8px}
  #modal .hd .in{flex-direction:column;align-items:flex-start}
  #modal .poster{width:88px}
  #cierre{padding:40px 20px 30px}
}

/* ---- El cartel del héroe ----
   Va aquí, al final, y no junto al resto de reglas del héroe: `#hero .inner`
   define su margen con la forma abreviada `padding`, y como tiene la misma
   especificidad, gana la que se escriba después. Puesto antes, el texto se metía
   por debajo de la carátula. */
@media(min-width:901px){
  /* El cartel deja de flotar encima y pasa a ser una columna del héroe: se estira
     el vitral se coloca a la derecha y el texto se recoge para dejarle sitio. */
  #hero .vitral-wrap{order:2;margin-left:auto;margin-right:clamp(10px,2vw,28px)}
  #hero .inner{max-width:min(600px,54%)}
}
@media(max-width:900px){
  /* Estrecho: el héroe se parte en dos pisos. El vitral va arriba —es lo primero
     que se ve— y debajo el título y lo demás. De lado no cabrían tres láminas
     sin comerse el título. */
  #hero{flex-direction:column;align-items:stretch;min-height:0}
  #hero .vitral-wrap{order:0;align-self:center;width:min(100%,340px);
    height:clamp(200px,46vw,260px);margin:clamp(18px,5vw,26px) auto 0}
  #hero .inner{padding-top:clamp(14px,4vw,20px)}
}

/* En pantallas táctiles no existe el estado :hover, así que todo lo que
   dependía de él tiene que estar ya en su sitio de partida. */
@media(hover:none){
  .card .foot{opacity:1}
  .card .fav{opacity:1;transform:scale(1)}
  .card:hover{transform:none}
}
/* Quien pide menos movimiento en su sistema no debe ver animaciones. Acortarlas a
   0,01 ms basta para las que se ejecutan una vez, pero NO para las que se repiten
   sin fin: la franja de cifras seguía dando su vuelta completa, sólo que cien mil
   veces por segundo, y se veía disparada. Hay que cortar también las repeticiones.
   (Pasó de verdad: en un PC con «efectos de animación» desactivado.) */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="ambient"><div class="orb a"></div><div class="orb b"></div><div class="grain"></div></div>

<nav id="nav">
  <div class="brand" onclick="App.home()"><span class="name">Cinefilos</span></div>
  <!-- Iconos dibujados a mano en vez de emoji: los emoji los pinta cada sistema a
       su manera, en color y con su propio estilo, y dentro de una barra sobria
       parecían pegatinas. Éstos heredan el color del botón y se ven igual en
       todas partes. -->
  <div class="search-wrap">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
    <input id="q" type="search" placeholder="Buscar película o serie, director, año…" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
  </div>
  <div class="acciones">
  <button class="nav-btn" id="btn-new" onclick="App.toggleNovedades()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.6 5.6 1.9-5.6 1.9L12 18.5l-1.9-5.6L4.5 11l5.6-1.9z"/><path d="M18.5 3.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
    <span class="lbl">Novedades</span> <span class="badge" id="new-count">0</span></button>
  <button class="nav-btn" id="btn-series" onclick="App.toggleSeries()" title="Series y miniseries">
    <svg class="i-series" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7.5" width="19" height="13" rx="2.5"/><path d="M8 3.2l4 4.3 4-4.3"/></svg>
    <svg class="i-pelis" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M7.5 4.5v15M16.5 4.5v15M2.5 12h19"/></svg>
    <span class="lbl">Series</span></button>
  <button class="nav-btn" id="btn-fav" onclick="App.toggleFavs()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2S4.4 15.6 4.4 10.3a4.1 4.1 0 0 1 7.6-2.2 4.1 4.1 0 0 1 7.6 2.2c0 5.3-7.6 9.9-7.6 9.9z"/></svg>
    <span class="lbl">Mi lista</span></button>
  <button class="nav-btn" id="btn-azar" onclick="App.azar()" title="Sorpréndeme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.6" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="currentColor" stroke="none"/></svg>
    <span class="lbl">Al azar</span></button>
  <button class="nav-btn" id="btn-cafe" onclick="App.abrirCafe()" title="Invítanos un café">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12v6.2A4.3 4.3 0 0 1 11.7 19H8.3A4.3 4.3 0 0 1 4 15.2z"/><path d="M16 10.5h1.6a2.6 2.6 0 0 1 0 5.2H16"/><path d="M7.6 3.4c-.8 1-.8 1.8 0 2.7M11.6 3.4c-.8 1-.8 1.8 0 2.7"/></svg>
    <span class="lbl">Café</span></button>
  <button class="nav-btn" id="btn-filtros" onclick="App.openFilters()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6M14.5 7.5h6M3.5 16.5h3M11.5 16.5h9"/><circle cx="12" cy="7.5" r="2.4"/><circle cx="9" cy="16.5" r="2.4"/></svg>
    <span class="lbl">Filtros</span> <span class="badge" id="f-count" style="display:none">0</span></button>
  </div>
</nav>


<section id="hero" hidden>
  <div class="bg"></div><div class="scrim"></div>
  <div class="vitral-wrap">
