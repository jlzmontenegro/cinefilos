<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinefilos — Catálogo</title>
<style>
/* ============================================================
   SPATIAL UI — materiales translúcidos, profundidad y luz
   ============================================================ */
:root{
  --r-card: 22px; --r-panel: 28px; --r-pill: 999px;
  --ease: cubic-bezier(.22,1,.36,1);
  --nav-h: 64px;
  --glass: rgba(255,255,255,.07);
  --glass-hi: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.16);
  --stroke-soft: rgba(255,255,255,.08);
  --txt: #f2f3f7;
  --txt-dim: rgba(242,243,247,.62);
  --txt-faint: rgba(242,243,247,.38);
  --accent: #ffc400;        /* amarillo taxi */
  --accent-2: #ffd84d;
  --sobre-accent: #0a0a0a;   /* texto sobre amarillo */
  --new: #ffc400;
  --bg-0:#06070c; --bg-1:#0d1018;
  --shadow-lift: 0 32px 64px -20px rgba(0,0,0,.75), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-panel: 0 40px 90px -30px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
/* El atributo hidden tiene que ganarle a cualquier display de esta hoja: #hero
   es display:flex y con la regla del navegador a secas seguía viéndose durante
   la búsqueda, así que no se notaba si había resultados o no. */
[hidden]{display:none!important}
/* clip, no hidden: recorta el desbordamiento lateral sin crear un contenedor
   de scroll. Tiene que ser clip en html Y en body: basta con que uno de los dos
   sea hidden para que el navegador lo convierta en contenedor de scroll y la
   barra superior deje de quedarse pegada arriba al bajar. */
html{overflow-x:clip}
html,body{margin:0;padding:0;max-width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color:var(--txt); background:var(--bg-0); min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:clip;
  font-synthesis-weight:none;
}
/* Ambiente: dos orbes de color que reaccionan al contenido destacado ------- */
#ambient{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 60%)}
#ambient .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  transition:background 1.6s var(--ease), transform 2.4s var(--ease)}
#ambient .orb.a{width:60vw;height:60vw;left:-12vw;top:-18vw;background:#2a3f7a}
#ambient .orb.b{width:52vw;height:52vw;right:-14vw;top:8vh;background:#5a2a6e}
#ambient .grain{position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* Superficie de vidrio reutilizable --------------------------------------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(180%);
  backdrop-filter:blur(34px) saturate(180%);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow-panel), inset 0 1px 0 rgba(255,255,255,.16);
}

/* ---------------------------- BARRA SUPERIOR ---------------------------- */
#nav{position:sticky;top:0;z-index:60;height:var(--nav-h);display:flex;align-items:center;
  gap:14px;padding:0 clamp(14px,3vw,34px);
  background:color-mix(in srgb, var(--bg-0) 72%, transparent);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border-bottom:1px solid var(--stroke-soft)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;
  font-size:15px;white-space:nowrap;cursor:pointer;user-select:none}
.brand .dot{width:12px;height:12px;border-radius:50%;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px 2px color-mix(in srgb,var(--accent) 60%,transparent)}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--txt-faint);letter-spacing:.02em}

.search-wrap{flex:1 1 200px;min-width:150px;max-width:560px;position:relative;margin-inline:auto}
#q{width:100%;height:40px;border-radius:var(--r-pill);border:1px solid var(--stroke);
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  color:var(--txt);padding:0 40px 0 40px;font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .25s var(--ease),background .2s}
#q::placeholder{color:var(--txt-faint)}
#q:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search-wrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--txt-faint);pointer-events:none;font-size:14px}
.search-wrap .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--txt-faint);border:1px solid var(--stroke);border-radius:6px;
  padding:2px 6px;pointer-events:none}
#q:not(:placeholder-shown)~.kbd{display:none}

.nav-btn{height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--stroke);
  background:var(--glass);color:var(--txt);font-size:13px;font-weight:550;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:transform .18s var(--ease),background .2s,border-color .2s}
.nav-btn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.nav-btn:active{transform:translateY(0) scale(.97)}
.nav-btn.on{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--sobre-accent)}
/* El café acompaña al resto de la barra y sólo se tiñe al pasar por encima */
#btn-cafe:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-pill);background:var(--new);
  color:var(--sobre-accent);font-size:11px;font-weight:800;display:inline-grid;place-items:center}

/* ------------------------------- HÉROE ---------------------------------- */
#hero{position:relative;margin:clamp(12px,2vw,22px) clamp(14px,3vw,34px) 8px;
  border-radius:var(--r-panel);overflow:hidden;min-height:clamp(300px,42vw,440px);
  display:flex;align-items:flex-end;isolation:isolate;box-shadow:var(--shadow-panel)}
#hero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;
  transform:scale(1.15);filter:blur(2px) saturate(125%);transition:opacity .7s var(--ease)}
#hero .scrim{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(78deg,rgba(3,5,10,.94) 0%,rgba(3,5,10,.72) 42%,rgba(3,5,10,.15) 78%),
             linear-gradient(0deg,rgba(3,5,10,.9),transparent 55%)}
#hero .inner{padding:clamp(20px,3.2vw,42px);max-width:min(680px,88%);display:flex;flex-direction:column;gap:12px}
#hero .eyebrow{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#hero h1{margin:0;font-size:clamp(26px,4.4vw,50px);line-height:1.03;letter-spacing:-.035em;font-weight:800}
#hero .orig{font-size:13px;color:var(--txt-dim);margin:-4px 0 0}
#hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#hero p.syn{margin:0;font-size:14.5px;line-height:1.55;color:var(--txt-dim);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn-primary{height:44px;padding:0 22px;border-radius:var(--r-pill);border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);font-size:14.5px;font-weight:650;
  display:inline-flex;align-items:center;gap:9px;
  box-shadow:0 14px 34px -12px color-mix(in srgb,var(--accent) 75%,transparent);
  transition:transform .18s var(--ease),box-shadow .25s var(--ease)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 46px -14px color-mix(in srgb,var(--accent) 85%,transparent)}
.btn-ghost{height:44px;padding:0 20px;border-radius:var(--r-pill);cursor:pointer;
  border:1px solid var(--stroke);background:var(--glass);color:var(--txt);font-size:14.5px;font-weight:600;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:inline-flex;align-items:center;gap:9px;transition:transform .18s var(--ease),background .2s}
.btn-ghost:hover{background:var(--glass-hi);transform:translateY(-2px)}
#hero .dots{position:absolute;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);display:flex;gap:7px;z-index:2}
#hero .dots i{width:7px;height:7px;border-radius:50%;background:var(--stroke);cursor:pointer;
  transition:all .3s var(--ease)}
#hero .dots i.on{width:24px;border-radius:var(--r-pill);background:var(--accent)}

/* ------------------------------- CHIPS ---------------------------------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;
  border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--glass);
  font-size:11.5px;font-weight:600;color:var(--txt-dim);white-space:nowrap}
.chip.solid{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);border-color:transparent}
.chip.new{background:var(--new);color:var(--sobre-accent);border-color:transparent;font-weight:800}
.chip.star{color:#f5c451;border-color:color-mix(in srgb,#f5c451 34%,transparent)}

/* ------------------------- FILAS TIPO CARRUSEL --------------------------- */
main{padding:0 0 90px}
.row{margin:clamp(18px,2.6vw,34px) 0}
.row-head{display:flex;align-items:baseline;gap:12px;padding:0 clamp(14px,3vw,34px);margin-bottom:12px}
.row-head h2{margin:0;font-size:clamp(16px,1.7vw,21px);font-weight:700;letter-spacing:-.02em}
.row-head .count{font-size:12px;color:var(--txt-faint);font-weight:500}
.row-head .more{margin-left:auto;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;
  opacity:0;transition:opacity .25s}
.row:hover .row-head .more{opacity:1}
.rail-wrap{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;
  padding:14px clamp(14px,3vw,34px) 22px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
.rail-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--stroke);background:var(--glass);color:var(--txt);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);cursor:pointer;display:grid;place-items:center;
  opacity:0;transition:opacity .25s,transform .2s var(--ease);font-size:17px}
.rail-wrap:hover .rail-btn{opacity:1}
.rail-btn:hover{transform:translateY(-50%) scale(1.1);background:var(--glass-hi)}
.rail-btn.l{left:clamp(6px,1.4vw,16px)} .rail-btn.r{right:clamp(6px,1.4vw,16px)}
@media (hover:none){.rail-btn{display:none}}

/* -------------------------------- TARJETA -------------------------------- */
.card{position:relative;flex:0 0 auto;width:var(--cw,168px);cursor:pointer;
  transform-style:preserve-3d;transition:transform .34s var(--ease)}
.card .shell{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:2/3;
  background:#12151f;border:1px solid var(--stroke-soft);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
  transition:box-shadow .34s var(--ease),border-color .3s}
.card .fill{position:absolute;inset:-14%;background-size:cover;background-position:center;
  filter:blur(22px) saturate(150%) brightness(.8);transform:scale(1.1)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  transition:transform .5s var(--ease);background:transparent}
/* Póster caído: ok.ru firma los enlaces de imagen y los caduca (410) al cabo de
   un año, así que la tarjeta se dibuja con fondo propio en vez de quedarse
   con el hueco roto del navegador. */
.card .shell.sin-poster{background:linear-gradient(155deg,#242b40,#12151f 62%)}
.card .shell.sin-poster::before{content:'🎞';position:absolute;inset:0 0 24% 0;display:grid;
  place-items:center;font-size:30px;opacity:.3}
#modal .poster.sin-poster{background:linear-gradient(155deg,#242b40,#12151f 62%)}
#modal .poster.sin-poster::before{content:'🎞';position:absolute;inset:0;display:grid;
  place-items:center;font-size:30px;opacity:.3}
.card .spec{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 62%)}
.card:hover{transform:translateY(-8px) scale(1.035)}
.card:hover .shell{box-shadow:var(--shadow-lift);border-color:var(--stroke)}
.card:hover img{transform:scale(1.07)}
.card:hover .spec{opacity:1}
.card .tags{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:5px;flex-wrap:wrap;z-index:2}
/* Las etiquetas van sobre el póster: siempre vidrio oscuro, sin importar el tema */
.card .tags .chip{background:rgba(5,7,14,.62);border-color:rgba(255,255,255,.2);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card .tags .chip.star{color:#f7cf6a;border-color:rgba(247,207,106,.42)}
.card .tags .chip.new{background:var(--new);color:var(--sobre-accent);border-color:transparent}
.card .fav{position:absolute;top:9px;right:9px;z-index:3;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--stroke);background:rgba(10,12,20,.5);-webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;font-size:13px;cursor:pointer;
  opacity:0;transform:scale(.8);transition:all .25s var(--ease)}
.card:hover .fav,.card .fav.on{opacity:1;transform:scale(1)}
.card .fav.on{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--sobre-accent)}
.card .foot{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 11px;z-index:2;
  background:linear-gradient(0deg,rgba(4,6,12,.94) 8%,rgba(4,6,12,.66) 48%,transparent);
  opacity:.94;transition:opacity .3s var(--ease)}
.card:hover .foot{opacity:1}
.card .foot b{display:block;font-size:12.5px;font-weight:650;line-height:1.25;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot span{display:block;font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dur{position:absolute;bottom:9px;right:9px;z-index:3;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:6px;background:rgba(4,6,12,.7);color:#fff;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.card:hover .dur{opacity:0}

/* ---------------- FRANJA DE TITULARES (catálogo en cifras) ---------------- */
#ticker{background:var(--accent);overflow:hidden;position:relative;
  border-block:1px solid rgba(0,0,0,.22);display:flex;align-items:center;height:34px}
#ticker .track{display:flex;flex:0 0 auto;align-items:center;white-space:nowrap;
  animation:correr 46s linear infinite;will-change:transform}
#ticker:hover .track{animation-play-state:paused}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#ticker .tk{display:inline-flex;align-items:center;gap:8px;padding:0 20px;
  font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sobre-accent)}
/* La etiqueta va en blanco sobre una píldora negra: blanco directo sobre
   amarillo no se lee (contraste ~1.8:1). */
#ticker .tk i{font-style:normal;background:var(--sobre-accent);color:#fff;
  padding:3px 9px;border-radius:var(--r-pill);font-size:10px;letter-spacing:.08em}
#ticker .sep{color:#fff;opacity:.9;font-size:13px;font-weight:900}
@media(max-width:640px){#ticker{height:30px}#ticker .tk{padding:0 14px;font-size:10.5px}}

/* -------------------------------- CIERRE --------------------------------- */
#cierre{padding:54px clamp(14px,3vw,34px) 40px;text-align:center;
  font-size:13.5px;line-height:1.7;color:var(--txt-dim);max-width:60ch;margin:0 auto}
#cierre p{margin:0}
/* Apoyo al proyecto: apagado hasta que se pasa por encima, para que esté ahí
   sin pedir nada a gritos. */
.apoyo{display:inline-flex;align-items:center;gap:8px;margin-top:24px;height:34px;padding:0 16px;
  border-radius:var(--r-pill);border:1px solid var(--stroke-soft);background:transparent;
  color:var(--txt-faint);font-size:12.5px;font-weight:600;text-decoration:none;
  transition:color .25s var(--ease),border-color .25s var(--ease),
             background .25s var(--ease),transform .25s var(--ease)}
.apoyo span{font-size:14px;filter:grayscale(1);opacity:.7;transition:filter .25s var(--ease),opacity .25s var(--ease)}
.apoyo:hover{color:var(--accent);transform:translateY(-1px);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.apoyo:hover span{filter:none;opacity:1}
.apoyo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ------------------------------- REJILLA -------------------------------- */
#grid-view{padding:0 clamp(14px,3vw,34px)}
.grid{display:grid;gap:clamp(12px,1.5vw,18px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(124px,13vw,170px),1fr))}
.grid .card{width:auto}
/* Cabecera de resultados: centrada, para que el término buscado y el número de
   coincidencias sean lo primero que se lee al terminar de escribir. */
.results-bar{display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:clamp(24px,3.4vw,40px) 0 clamp(16px,2.2vw,24px);text-align:center}
.results-bar::after{content:'';width:min(260px,55%);height:1px;
  background:linear-gradient(90deg,transparent,var(--stroke),transparent)}
.res-info{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.results-bar .linea{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.results-bar h2{margin:0;font-size:clamp(21px,3vw,33px);font-weight:800;letter-spacing:-.032em;
  line-height:1.15;max-width:22ch;overflow-wrap:anywhere}
.results-bar h2 .term{color:var(--accent)}
.results-bar .sub{font-size:13px;color:var(--txt-faint)}
.res-tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:100%}
/* Marcador de resultados: se ve de un vistazo si la búsqueda encontró algo */
.res-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 15px;
  border-radius:var(--r-pill);font-size:12.5px;font-weight:750;white-space:nowrap;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.res-pill.vacio{background:rgba(255,88,88,.15);color:#ff9f9f;border-color:rgba(255,88,88,.42)}
.res-pill:empty{display:none}
select.sel{height:34px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:var(--glass);
  color:var(--txt);font-size:12.5px;padding:0 30px 0 13px;cursor:pointer;outline:none;font-weight:550;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
select.sel option{background:#12151f;color:#f2f3f7}
.active-filters{display:flex;gap:7px;flex-wrap:wrap}
.af{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 12px;border-radius:var(--r-pill);
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--sobre-accent);font-size:11.5px;font-weight:650}
.af b{opacity:.75;font-weight:600}
.af button{background:rgba(0,0,0,.24);border:none;color:var(--sobre-accent);width:17px;height:17px;border-radius:50%;
  cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
#sentinel{height:60px;display:grid;place-items:center;color:var(--txt-faint);font-size:12.5px}
.empty{text-align:center;padding:70px 20px 90px;color:var(--txt-dim)}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.5}
.empty b{display:block;font-size:clamp(17px,2.2vw,22px);color:var(--txt);font-weight:750;
  letter-spacing:-.02em;margin-bottom:8px}
.empty b .term{color:var(--accent)}
.empty p{margin:0 auto;max-width:46ch;font-size:14px;line-height:1.6}

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
/* ==========================================================================
   Catálogo Cinefilos — lógica de la interfaz
   Los datos vienen incrustados en el <script id="data">, así que el archivo
   funciona sin servidor ni conexión (salvo pósters y reproductor, que son
   remotos).
   ========================================================================== */
const C = crearClasificador();

/* Los datos van guardados por columnas y sin lo que se puede recalcular, para
   que el archivo pese bastante menos. Aquí se reconstruyen los objetos tal y
   como los produce normalize.mjs, así que el resto del código no se entera. */
const DB = (() => {
  const raw = JSON.parse(document.getElementById('data').textContent);
  const { campos, dic, px, filas } = raw;
  const movies = filas.map((f) => {
    const m = {};
    campos.forEach((c, i) => {
      let v = f[i];
      if (v !== null) {
        if (c === 'paises' || c === 'generos') v = v.map((x) => dic[c][x]);
        else if (c === 'tipo' || c === 'idioma') v = dic[c][v];
        else if (c === 'poster' && !/^https?:/.test(v)) v = px + v;
      }
      m[c] = v;
    });
    // campos derivados: no se guardan porque se obtienen de los anteriores
    m.titulo = m.tituloAlt || m.tituloOriginal;
    m.url = `https://ok.ru/cinefiliamalversa/topic/${m.id}`;
    m.decada = m.anio ? Math.floor(m.anio / 10) * 10 : null;
    m.paises = m.paises || [];
    m.generos = m.generos || [];
    m.directores = m.directores || [];
    m.banderas = m.paises.map((p) => C.FLAG[p] || '🏳️');
    m.thumb = null;
    m.comentarios = 0;
    return m;
  });
  return { meta: raw.meta, movies };
})();
const META = DB.meta;

/* Novedades que el propio catálogo ha descargado desde la última reconstrucción.
   Viven en el navegador y se funden con los datos incrustados en el archivo. */
const DELTA = (() => {
  try { return JSON.parse(localStorage.getItem('cm.delta')) || []; } catch { return []; }
})();
/* Sólo se puede ver algo si hay reproducción directa (videoId) o al menos una
   fuente alternativa (embed). Lo demás es una ficha sin película detrás, así que
   se queda fuera del catálogo: fuera de las cifras, de los filtros y del buscador. */
const reproducible = m => !!(m && (m.videoId || m.embed));
const M = (() => {
  const base = new Set(DB.movies.map(m => m.id));
  return [...DB.movies, ...DELTA.filter(d => d && d.id && !base.has(d.id))]
    .filter(reproducible)
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
})();

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hhmm = s => { if (!s) return null; const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, '0')} min` : `${m} min`; };
const fecha = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' }); };

const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('cm.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cm.' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- índice de búsqueda ---------- */
M.forEach((m, i) => {
  m._i = i;
  // Tres niveles: los títulos sueltos, títulos + dirección, y la ficha entera.
  // El buscador los usa para no dar el mismo peso a un título que a una sinopsis.
  m._tits = [m.titulo, m.tituloOriginal, m.tituloAlt].filter(Boolean).map(fold);
  m._tit = m._tits.join(' · ');
  m._t = m._tit + ' ' + fold((m.directores || []).join(' '));
  m._s = m._t + ' ' + fold([(m.paises || []).join(' '), (m.generos || []).join(' '),
    m.anio, m.tipo, m.sinopsis].join(' '));
});

/* Palabras que no distinguen nada: si se buscan dentro de la sinopsis, cualquier
   frase normal devuelve medio catálogo. Sólo cuentan si están en el título o en
   la dirección, igual que las palabras de tres letras o menos. */
const VACIAS = new Set(('de del la el los las un una unos unas y e o u que no ni con por para al ' +
  'en es son su sus se lo le les como mas más pero sin sobre entre cuando donde todo toda todos ' +
  'todas esta este esto esa ese eso aquel muy ya tras desde hasta a').split(' '));
const debil = t => t.length <= 3 || VACIAS.has(t);

/* ---------- novedades: qué había la última vez ---------- */
const NOVEDADES = (() => {
  const prev = LS.get('seen', null);
  let ids;
  if (!prev) {                       // primera visita: novedades = últimos 10 días
    const corte = Date.now() - 10 * 864e5;
    ids = M.filter(m => m.fecha && new Date(m.fecha).getTime() > corte).map(m => m.id);
  } else {
    const set = new Set(prev);
    ids = M.filter(m => !set.has(m.id)).map(m => m.id);
  }
  return new Set(ids);
})();
const marcarVistas = () => { LS.set('seen', M.map(m => m.id)); };

/* ---------- estado ---------- */
const FAVS = new Set(LS.get('favs', []));
const S = {
  q: '', generos: new Set(), paises: new Set(), decadas: new Set(), tipos: new Set(),
  idiomas: new Set(), directores: new Set(), imdbMin: 0, soloNuevas: false, soloFavs: false,
  soloDirecta: false, orden: 'recientes', anioMin: null, anioMax: null
};

/* ---------- facetas ---------- */
function contar(campo) {
  const c = new Map();
  for (const m of M) {
    const v = m[campo];
    if (Array.isArray(v)) v.forEach(x => c.set(x, (c.get(x) || 0) + 1));
    else if (v != null && v !== '') c.set(v, (c.get(v) || 0) + 1);
  }
  return [...c.entries()].sort((a, b) => b[1] - a[1]);
}
const F = {
  generos: contar('generos'), paises: contar('paises'), tipos: contar('tipo'),
  idiomas: contar('idioma'), decadas: contar('decada').sort((a, b) => b[0] - a[0]),
  directores: (() => {
    const c = new Map();
    M.forEach(m => (m.directores || []).forEach(d => c.set(d, (c.get(d) || 0) + 1)));
    return [...c.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  })()
};
const ANIOS = M.map(m => m.anio).filter(Boolean);
const ANIO_MIN = Math.min(...ANIOS), ANIO_MAX = Math.max(...ANIOS);

/* ---------- filtrado ---------- */
/* Qué tan bien encaja una película con lo buscado: cuanto más bajo, más arriba. */
function relevancia(m, q, terms) {
  if (m._tits.includes(q)) return 0;                     // el título es justo eso
  if (m._tits.some(t => t.startsWith(q))) return 1;      // el título empieza así
  if (terms.every(t => m._tit.includes(t))) return 2;    // está en el título
  if (terms.every(t => m._t.includes(t))) return 3;      // está en la dirección
  return 4;                                              // sólo en el resto de la ficha
}

function filtrar() {
  const q = fold(S.q).trim();
  const terms = q ? q.split(/\s+/).filter(Boolean) : [];
  const coincide = (m, t) => debil(t) ? m._t.includes(t) : m._s.includes(t);
  let out = M.filter(m => {
    if (terms.length && !terms.every(t => coincide(m, t))) return false;
    if (S.generos.size && !(m.generos || []).some(g => S.generos.has(g))) return false;
    if (S.paises.size && !(m.paises || []).some(p => S.paises.has(p))) return false;
    if (S.decadas.size && !S.decadas.has(m.decada)) return false;
    if (S.tipos.size && !S.tipos.has(m.tipo)) return false;
    if (S.idiomas.size && !S.idiomas.has(m.idioma)) return false;
    if (S.directores.size && !(m.directores || []).some(d => S.directores.has(d))) return false;
    if (S.imdbMin && !(m.imdb >= S.imdbMin)) return false;
    if (S.anioMin && !(m.anio >= S.anioMin)) return false;
    if (S.anioMax && !(m.anio <= S.anioMax)) return false;
    if (S.soloNuevas && !NOVEDADES.has(m.id)) return false;
    if (S.soloFavs && !FAVS.has(m.id)) return false;
    if (S.soloDirecta && !m.videoId) return false;
    return true;
  });
  const ord = {
    recientes: (a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')),
    'anio-desc': (a, b) => (b.anio || 0) - (a.anio || 0),
    'anio-asc': (a, b) => (a.anio || 9999) - (b.anio || 9999),
    imdb: (a, b) => (b.imdb || 0) - (a.imdb || 0),
    titulo: (a, b) => fold(a.titulo).localeCompare(fold(b.titulo)),
    duracion: (a, b) => (b.duracion || 0) - (a.duracion || 0)
  }[S.orden];
  // Al buscar manda la relevancia, salvo que se haya pedido un orden concreto:
  // en ese caso se respeta al pie de la letra.
  if (!terms.length || S.orden !== 'recientes') return out.sort(ord);
  const peso = new Map(out.map(m => [m, relevancia(m, q, terms)]));
  return out.sort((a, b) => peso.get(a) - peso.get(b) || ord(a, b));
}
const hayFiltros = () => S.q.trim() || S.generos.size || S.paises.size || S.decadas.size || S.tipos.size ||
  S.idiomas.size || S.directores.size || S.imdbMin || S.soloNuevas || S.soloFavs || S.soloDirecta ||
  S.anioMin || S.anioMax;

/* Los enlaces de imagen de ok.ru van firmados y caducan con el tiempo: cuando
   uno devuelve 410 se marca el contenedor para que dibuje su propio fondo. */
function posterCaido(el) {
  const caja = el.closest('.shell') || el.closest('.poster');
  if (caja) {
    caja.classList.add('sin-poster');
    caja.querySelector('.fill')?.remove();
  }
  el.remove();
}
window.posterCaido = posterCaido;

/* ---------- tarjeta ---------- */
function card(m) {
  const nuevo = NOVEDADES.has(m.id);
  const fav = FAVS.has(m.id);
  const img = m.poster || m.thumb || '';
  const sub = [m.anio, (m.directores || [])[0]].filter(Boolean).join(' · ');
  return `<article class="card" data-id="${m.id}" tabindex="0" aria-label="${esc(m.titulo)}">
    <div class="shell">
      ${img ? `<div class="fill" style="background-image:url('${esc(img)}')"></div>
      <img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="posterCaido(this)">` : ''}
      <div class="spec"></div>
      <div class="tags">
        ${nuevo ? '<span class="chip new">NUEVO</span>' : ''}
        ${m.imdb ? `<span class="chip star">★ ${m.imdb.toFixed(1)}</span>` : ''}

      <div class="foot">
        <b>${esc(m.titulo)}</b>
        <span>${esc(sub)}</span>

/* ---------- filas ---------- */
function fila(titulo, lista, extra = '') {
  if (!lista.length) return '';
  const id = 'r' + Math.random().toString(36).slice(2, 8);
  return `<section class="row">
    <div class="row-head">
      <h2>${esc(titulo)}</h2><span class="count">${lista.length}</span>
      ${extra ? `<span class="more" data-more='${extra}'>Ver todas →</span>` : ''}
    </div>
    <div class="rail-wrap">
      <button class="rail-btn l" data-rail="${id}" data-dir="-1">‹</button>
      <div class="rail" id="${id}">${lista.slice(0, 32).map(card).join('')}</div>
      <button class="rail-btn r" data-rail="${id}" data-dir="1">›</button>
    </div>
  </section>`;
}

function construirFilas() {
  const nuevas = M.filter(m => NOVEDADES.has(m.id));
  const recientes = M.slice(0, 32);
  const top = [...M].filter(m => m.imdb >= 7.5).sort((a, b) => b.imdb - a.imdb).slice(0, 32);
  const clasicos = [...M].filter(m => m.anio && m.anio < 1970).sort((a, b) => b.imdb - a.imdb).slice(0, 32);
  const html = [];

  if (nuevas.length) html.push(fila(`✦ Novedades desde tu última visita`, nuevas, JSON.stringify({ soloNuevas: true })));
  if (FAVS.size) html.push(fila('♥ Mi lista', M.filter(m => FAVS.has(m.id)), JSON.stringify({ soloFavs: true })));
  html.push(fila('Añadidas recientemente', recientes));
  html.push(fila('Mejor valoradas en IMDb', top, JSON.stringify({ imdbMin: 7.5 })));

  // Un carrusel por cada género importante
  for (const [g, n] of F.generos.slice(0, 10)) {
    if (n < 8) continue;
    html.push(fila(g, M.filter(m => (m.generos || []).includes(g)), JSON.stringify({ generos: [g] })));
  }
  html.push(fila('Clásicos anteriores a 1970', clasicos, JSON.stringify({ anioMax: 1969 })));
  // Un carrusel por país destacado
  for (const [p, n] of F.paises.slice(1, 7)) {
    if (n < 10) continue;
    html.push(fila(`Cine de ${p}`, M.filter(m => (m.paises || []).includes(p)), JSON.stringify({ paises: [p] })));
  }
  // Décadas
  for (const [d, n] of F.decadas) {
    if (n < 25 || !d) continue;
    html.push(fila(`Los ${d}`, M.filter(m => m.decada === d), JSON.stringify({ decadas: [d] })));
  }
  $('#rows-view').innerHTML = html.join('');
}

/* Franja de titulares con el catálogo en cifras, en marcha continua.
   El contenido se duplica para que el bucle no dé un salto al reiniciarse. */
function construirTicker() {
  const dirs = new Set(); M.forEach(m => (m.directores || []).forEach(d => dirs.add(d)));
  const horas = Math.round(M.reduce((s, m) => s + (m.duracion || 0), 0) / 3600);
  const decTop = F.decadas.slice().sort((a, b) => b[1] - a[1])[0];
  const stats = [
    [M.length.toLocaleString('es'), 'Títulos'],
    [dirs.size.toLocaleString('es'), 'Directores'],
    [F.paises.length, 'Países'],
    [F.generos.length, 'Géneros'],
    [`${ANIO_MIN}–${ANIO_MAX}`, 'Años de cine'],
    [decTop ? decTop[0] + 's' : '—', 'Década más nutrida'],
    [horas.toLocaleString('es'), 'Horas de metraje'],
    [M.filter(m => m.videoId).length.toLocaleString('es'), 'Con reproducción directa'],
  ];
  const tanda = stats.map(([v, k]) =>
    `<span class="tk">${esc(v)} <i>${esc(k)}</i></span><span class="sep">◆</span>`).join('');

}

/* ---------- rejilla con carga progresiva ---------- */
let gridData = [], gridShown = 0;
function pintarGrid(reset) {
  if (reset) { gridData = filtrar(); gridShown = 0; $('#grid').innerHTML = ''; }
  const lote = gridData.slice(gridShown, gridShown + 60);
  $('#grid').insertAdjacentHTML('beforeend', lote.map(card).join(''));
  gridShown += lote.length;
  $('#sentinel').textContent = gridShown >= gridData.length
    ? (gridData.length ? '· fin del catálogo ·' : '') : 'Cargando…';
  if (reset) {
    const n = gridData.length;
    const q = S.q.trim();
    $('#res-title').innerHTML = q ? `<span class="term">“${esc(q)}”</span>`
      : (S.soloNuevas ? 'Novedades' : S.soloFavs ? 'Mi lista' : 'Explorar catálogo');
    // buscando, el orden por defecto es la relevancia; sin buscar, la fecha
    $('#sort').options[0].textContent = q ? 'Más relevantes' : 'Añadidas primero';
    // Marcador visible: dice sin rodeos si la búsqueda encontró algo
    const pill = $('#res-pill');

    pill.classList.toggle('vacio', !n);
    $('#res-sub').textContent = n
      ? (q ? `de ${M.length.toLocaleString('es')} títulos del catálogo`
           : `${n.toLocaleString('es')} título${n === 1 ? '' : 's'} con lo que has elegido`)
      : (q ? 'Revisa la ortografía o usa menos palabras'
           : 'Ningún título coincide con los filtros activos');
    if (!n) {
      $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="big">🔍</div>
        <b>${q ? `No encontramos nada para <span class="term">“${esc(q)}”</span>`
               : 'Ningún título coincide con los filtros'}</b>
        <p>${q ? 'Prueba con menos palabras o revisa la ortografía. También puedes buscar por director, país, género o año.'

    }
  }
  pintarChipsActivos();
}

/* Extrae un color dominante del póster y lo lleva al fondo */
const tinteCache = new Map();
function tinteAmbiente(url) {
  if (!url) return;
  if (tinteCache.has(url)) return aplicarTinte(tinteCache.get(url));
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      const col = [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
      tinteCache.set(url, col); aplicarTinte(col);
    } catch {}
  };
  im.src = url;
}
function aplicarTinte([r, g, b]) {
  $('#ambient .orb.a').style.background = `rgb(${r},${g},${b})`;
  $('#ambient .orb.b').style.background = `rgb(${Math.round(b * .8)},${Math.round(r * .7)},${Math.round(g * .9)})`;
}

          ${m.anio ? `<dt>Año</dt><dd><span class="lnk" data-dec="${m.decada}">${m.anio}</span></dd>` : ''}
          ${m.duracion ? `<dt>Duración</dt><dd>${hhmm(m.duracion)}</dd>` : ''}
          ${m.filmaffinity ? `<dt>FilmAffinity</dt><dd>★ ${m.filmaffinity}</dd>` : ''}
          ${m.notas ? `<dt>Versión</dt><dd>${esc(m.notas)}</dd>` : ''}
          <dt>Publicado</dt><dd>${fecha(m.fecha)}</dd>
        </dl>
      </div>
    </div>
    ${rel.length ? `<div class="bd" style="grid-template-columns:1fr;padding-top:0">
      <div><h3 style="font-size:15px;margin:0 0 12px">También te puede interesar</h3>
      <div class="related">${rel.map(card).join('')}</div></div></div>` : ''}`;

  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  ponerHash(m.id);
  tinteAmbiente(img);
  if (autoplay && m.videoId) reproducir(m.videoId);
}

/* ---------- enlace directo a una ficha ----------
   .../cinefilos/#p<id> abre esa película nada más cargar. Lo usan los correos de
   novedades y sirve para compartir un título concreto. El prefijo «p» evita que
   el navegador confunda el identificador con el ancla de algún elemento.
   Se hace con el hash y no con history.pushState porque la página también tiene
   que funcionar abierta con file://, donde el historial da problemas. */
const idDelHash = () => (location.hash.match(/^#p(\d+)$/) || [])[1] || null;
let ignorarHash = false;

function ponerHash(valor) {
  ignorarHash = true;
  try {
    if (valor) location.hash = 'p' + valor;
    else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch { if (!valor) location.hash = ''; }   // file:// puede rechazar replaceState
  setTimeout(() => { ignorarHash = false; }, 0);
}

addEventListener('hashchange', () => {
  if (ignorarHash) return;
  const id = idDelHash();
  if (id) abrirModal(id, false);
  else if ($('#modal').classList.contains('open')) App.closeModal();
});
function reproducir(vid) {
  const p = $('#player');
  p.innerHTML = `<iframe src="https://ok.ru/videoembed/${encodeURIComponent(vid)}?autoplay=1"
    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
  p.classList.add('on');
  p.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- API pública ---------- */
const App = {
  aplicar() {
    const hay = !!hayFiltros();
    $('#rows-view').hidden = hay;
    $('#hero').hidden = hay;
    $('#grid-view').hidden = !hay;
    // Con el héroe oculto no tiene sentido que siga rotando ni recoloreando el fondo
    if (hay) { clearInterval(heroTimer); heroTimer = null; }
    else if (!heroTimer && heroList.length > 1) {
      heroTimer = setInterval(() => pintarHero((heroI + 1) % heroList.length), 9000);
    }
    if (hay) pintarGrid(true); else { pintarChipsActivos(); }
    $('#btn-new').classList.toggle('on', S.soloNuevas);
    $('#btn-fav').classList.toggle('on', S.soloFavs);
    actualizarContadoresGrupo();
  },
  home() {
    S.q = ''; $('#q').value = '';
    ['generos', 'paises', 'decadas', 'tipos', 'idiomas', 'directores'].forEach(k => S[k].clear());
    S.imdbMin = 0; S.soloNuevas = S.soloFavs = S.soloDirecta = false; S.anioMin = S.anioMax = null;
    construirFiltros(); this.aplicar(); scrollTo({ top: 0, behavior: 'smooth' });
  },
  clearFilters() { this.home(); },
  /* Borra sólo el texto buscado y deja intactos los filtros del panel */
  limpiarBusqueda() {
    S.q = ''; $('#q').value = ''; this.aplicar();
    $('#q').focus(); scrollTo({ top: 0, behavior: 'smooth' });
  },
  arriba() { scrollTo({ top: 0, behavior: 'smooth' }); },
  openFilters() { $('#filters').classList.add('open'); $('#scrim').classList.add('on'); },
  closeFilters() { $('#filters').classList.remove('open'); $('#scrim').classList.remove('on'); },
  toggleNovedades() { S.soloNuevas = !S.soloNuevas; if (S.soloNuevas) S.soloFavs = false; this.aplicar(); scrollTo({top:0,behavior:'smooth'}); },
  toggleFavs() { S.soloFavs = !S.soloFavs; if (S.soloFavs) S.soloNuevas = false; this.aplicar(); scrollTo({top:0,behavior:'smooth'}); },
  closeModal() {
    $('#modal').classList.remove('open'); $('#sheet').innerHTML = '';
    document.body.style.overflow = ''; ponerHash(null);
  },
  sync() { buscarNovedades({ silencioso: false }); },
  /* Una recomendación al azar entre lo que hay filtrado ahora mismo */
  azar() {
    const pool = (hayFiltros() ? filtrar() : M).filter(m => m.sinopsis);
    if (!pool.length) return;
    abrirModal(pool[Math.floor(Math.random() * pool.length)].id, false);
  },
  set(patch) {
    Object.entries(patch).forEach(([k, v]) => {
      if (S[k] instanceof Set) { S[k].clear(); (Array.isArray(v) ? v : [v]).forEach(x => S[k].add(x)); }
      else S[k] = v;
    });
    construirFiltros(); this.aplicar(); scrollTo({ top: 0, behavior: 'smooth' });
  }
};
window.App = App;

/* ---------- eventos globales ---------- */
document.addEventListener('click', e => {
  const t = e.target;

  const fav = t.closest('[data-fav]');
  if (fav) {
    e.stopPropagation();
    const id = fav.dataset.fav;
    FAVS.has(id) ? FAVS.delete(id) : FAVS.add(id);
    LS.set('favs', [...FAVS]);
    $$(`[data-fav="${id}"]`).forEach(b => {
      const on = FAVS.has(id);
      b.classList.toggle('on', on);
      b.textContent = b.classList.contains('btn-ghost') ? (on ? '♥ En mi lista' : '♡ Mi lista') : (on ? '♥' : '♡');
    });
    return;
  }
  const play = t.closest('[data-play]');
  if (play) { reproducir(play.dataset.play); return; }

  const c = t.closest('.card');
  if (c) { abrirModal(c.dataset.id, false); return; }

  const rail = t.closest('[data-rail]');
  if (rail) {
    const el = document.getElementById(rail.dataset.rail);
    el.scrollBy({ left: (+rail.dataset.dir) * el.clientWidth * .82, behavior: 'smooth' });
    return;
  }
  const opt = t.closest('[data-set]');
  if (opt) {
    const k = opt.dataset.set;
    let v = opt.dataset.val;
    if (k === 'decadas') v = +v;
    S[k].has(v) ? S[k].delete(v) : S[k].add(v);
    opt.classList.toggle('on');
    App.aplicar();
    return;
  }
  const clr = t.closest('[data-clear]');
  if (clr) {
    const [k, v] = JSON.parse(clr.dataset.clear);
    if (S[k] instanceof Set) S[k].delete(k === 'decadas' ? +v : v);
    else S[k] = (k === 'imdbMin') ? 0 : (typeof S[k] === 'boolean' ? false : null);
    construirFiltros(); App.aplicar();
    return;
  }
  const more = t.closest('[data-more]');
  if (more) { App.set(JSON.parse(more.dataset.more)); return; }

  // enlaces dentro del detalle
  if (t.dataset.dirname) { App.closeModal(); App.set({ directores: [t.dataset.dirname] }); return; }
  if (t.dataset.gen) { App.closeModal(); App.set({ generos: [t.dataset.gen] }); return; }
  if (t.dataset.pais) { App.closeModal(); App.set({ paises: [t.dataset.pais] }); return; }
  if (t.dataset.dec) { App.closeModal(); App.set({ decadas: [+t.dataset.dec] }); return; }
  if (t.dataset.h != null) { pintarHero(+t.dataset.h); return; }
});

/* reflejo especular que sigue al puntero */
document.addEventListener('pointermove', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');

/* teclado */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') {
    if ($('#modal').classList.contains('open')) App.closeModal();
    else if ($('#filters').classList.contains('open')) App.closeFilters();
  }
  if (e.key === 'Enter' && document.activeElement?.classList.contains('card')) {
    abrirModal(document.activeElement.dataset.id, false);
  }
});

/* ============ actualización desde el propio catálogo ============
   Un archivo abierto con file:// no puede leer ok.ru por su cuenta: el navegador lo
   impide por CORS y ok.ru no envía cabeceras que lo permitan. La única vía que no
   obliga a instalar nada es un proxy público que reenvíe la página añadiendo
   Access-Control-Allow-Origin. Es un servicio gratuito y falla a menudo (~1 de cada
   3 peticiones), así que cada descarga se reintenta y el recorrido es reanudable:
   lo que se llegó a bajar queda guardado aunque el resto falle.
   Si el proxy desaparece, esto deja de funcionar y queda "Actualizar catálogo.cmd",
   que va directo a ok.ru y no depende de terceros. */
const PROXY = (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);
const TOPE_EN_PAGINA = 60;   // más allá de esto, el .cmd es mucho más rápido

async function traer(url, intentos = 4) {
  for (let i = 0; i < intentos; i++) {
    const ctrl = new AbortController();
    const reloj = setTimeout(() => ctrl.abort(), 30000);
    try {
      const r = await fetch(PROXY(url), { signal: ctrl.signal });
      clearTimeout(reloj);
      if (r.ok) {
        const txt = await r.text();
        if (txt.includes('application/ld+json')) return txt;
      }
    } catch { clearTimeout(reloj); }
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  return null;
}

function aviso(texto, ms = 4000, accion = null) {
  const t = $('#toast');
  t.innerHTML = `<span>${texto}</span>` + (accion ? `<button id="t-act">${accion.txt}</button>` : '') +
    `<button class="x" id="t-x">✕</button>`;
  t.classList.add('on');
  $('#t-x').onclick = () => t.classList.remove('on');
  if (accion) $('#t-act').onclick = () => { t.classList.remove('on'); accion.fn(); };
  clearTimeout(aviso._t);
  if (ms) aviso._t = setTimeout(() => t.classList.remove('on'), ms);
}

let sincronizando = false;
async function buscarNovedades({ silencioso = false } = {}) {
  if (sincronizando) return;
  sincronizando = true;
  $('#btn-sync').classList.add('activo');
  const nuevos = [];
  let cortadoPorTope = false;

  try {
    // Partimos del título más reciente que ya tenemos y subimos por la cadena
    // rel="prev", que apunta siempre a la publicación inmediatamente posterior.
    if (!silencioso) aviso('Buscando novedades en ok.ru…', 0);
    const ancla = M[0];
    const primera = await traer(`https://ok.ru/cinefiliamalversa/topic/${ancla.id}`);
    if (!primera) {
      if (!silencioso) aviso('El servicio intermediario no responde. El catálogo sigue completo.',
        12000, { txt: 'Reintentar', fn: () => buscarNovedades({}) });
      return;
    }
    let cursor = C.parseTopicHTML(primera)?.prevId;
    const conocidos = new Set(M.map(m => m.id));
    const visitados = new Set();
    const desde = String(ancla.fecha || '');

    while (cursor) {
      if (nuevos.length >= TOPE_EN_PAGINA) { cortadoPorTope = true; break; }
      if (visitados.has(cursor)) break;   // la cadena se ha cerrado sobre sí misma
      visitados.add(cursor);
      if (!silencioso) aviso(`Descargando novedades… ${nuevos.length} encontradas`, 0);
      const h = await traer(`https://ok.ru/cinefiliamalversa/topic/${cursor}`);
      if (!h) break;                      // se corta: lo recogido se guarda igual
      const crudo = C.parseTopicHTML(h);
      if (!crudo || !crudo.id) break;

      // ok.ru coloca los mensajes fijados al principio de la cadena, así que
      // subir por prev puede llevar a un post antiguo. Cualquier publicación que
      // no sea posterior al ancla significa que ya estamos en terreno conocido.
      if (crudo.published && String(crudo.published) <= desde) break;

      if (!conocidos.has(crudo.id)) {
        const peli = C.construirPelicula(crudo);
        // sin vídeo ni fuente alternativa no entra, pero se marca como visto
        if (peli && reproducible(peli)) nuevos.push(peli);
        conocidos.add(crudo.id);
      }
      if (!crudo.prevId || crudo.prevId === crudo.id) break;
      cursor = crudo.prevId;
    }
  } finally {
    sincronizando = false;
    $('#btn-sync').classList.remove('activo');
    LS.set('ultimaSync', Date.now());
  }

  if (!nuevos.length) {
    if (!silencioso) aviso('El catálogo ya está al día', 3500);
    return;
  }
  try {
    localStorage.setItem('cm.delta', JSON.stringify([...DELTA, ...nuevos]));
  } catch {
    aviso('Hay demasiadas novedades para guardarlas en el navegador. Ejecuta «Actualizar catálogo.cmd».', 9000);
    return;
  }
  aviso(`${nuevos.length} título${nuevos.length === 1 ? '' : 's'} nuevo${nuevos.length === 1 ? '' : 's'}` +
    (cortadoPorTope ? ' (hay más: usa el .cmd)' : '') + '. Actualizando…', 0);
  setTimeout(() => location.reload(), 1600);
}

/* ---------- aviso de novedades ---------- */
function avisoNovedades() {
  if (!NOVEDADES.size) return;
  const t = $('#toast');
  t.innerHTML = `<span>✦ <b>${NOVEDADES.size}</b> título${NOVEDADES.size === 1 ? '' : 's'} nuevo${NOVEDADES.size === 1 ? '' : 's'} desde tu última visita</span>
    <button id="t-ver">Ver</button><button class="x" id="t-x">✕</button>`;
  t.classList.add('on');
  $('#t-ver').onclick = () => { App.toggleNovedades(); t.classList.remove('on'); marcarVistas(); };
  $('#t-x').onclick = () => { t.classList.remove('on'); marcarVistas(); };
  setTimeout(() => t.classList.remove('on'), 14000);
}

/* ---------- arranque ---------- */
$('#stamp').textContent = `${M.length.toLocaleString('es')} títulos · act. ${fecha(LS.get('ultimaSync', 0) || META.generado)}`;
$('#new-count').textContent = NOVEDADES.size;
$('#btn-new').style.display = NOVEDADES.size ? '' : 'none';
construirHero();
construirFilas();
construirTicker();
construirFiltros();
App.aplicar();
// Si se ha llegado con un enlace directo (#p<id>), se abre esa ficha
if (idDelHash()) abrirModal(idDelHash(), false);
setTimeout(avisoNovedades, 1400);

/* Comprobación automática al abrir, como mucho una vez cada 6 horas y en silencio:
   si el proxy falla no se muestra nada y el catálogo sigue funcionando igual. */
if (navigator.onLine && Date.now() - (LS.get('ultimaSync', 0) || 0) > 6 * 3600e3) {
  setTimeout(() => buscarNovedades({ silencioso: true }), 5000);
}
